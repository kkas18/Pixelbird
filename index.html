<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5BC8F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixelfugl">
<meta name="description" content="Pixelfugl – et moderne flakse-spill. Trykk for å flakse.">
<title>Pixelfugl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root { --sky: #5BC8F0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: var(--sky);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: 'Fredoka', system-ui, sans-serif;
  }
  body { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #install {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: none; border: 0; cursor: pointer; border-radius: 999px;
    font: 600 15px/1 'Fredoka', system-ui, sans-serif; color: #2B2400;
    background: #FFD23F; padding: 14px 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,.22), inset 0 -3px 0 rgba(0,0,0,.12);
  }
  #install:active { transform: translateX(-50%) scale(.96); }
  #install.show { display: block; }
  #fontprobe { position: absolute; opacity: 0; pointer-events: none; left: -9999px; font-weight: 700; }
</style>
</head>
<body>
<canvas id="game" aria-label="Pixelfugl spill" role="img"></canvas>
<button id="install" type="button">Installer Pixelfugl</button>
<span id="fontprobe">0123456789</span>

<script>
'use strict';
/* ============================================================
   PIXELFUGL v2 – glatt vektorgrafikk, vanskelighetsgrader,
   rør-varianter og power-ups. Logisk bredde 288 px,
   høyde følger skjermen. Fast tidssteg 60 Hz.
   ============================================================ */

const LOGICAL_W = 288;
const STEP = 1 / 60;
const MAX_FALL = 8.5;
const PIPE_W = 56;
const PIPE_CAP_H = 26;
const GROUND_H = 92;
const BIRD_X = 78;
const BIRD_R = 11;
const POWER_R = 13;

/* ---------- Vanskelighetsgrader ---------- */
const DIFFS = {
  lett:   { label: 'Lett',   gap: 152, speed: 1.9, spacing: 192, gravity: 0.28, flap: -5.3, variantsFrom: 14, color: '#5DD07A' },
  normal: { label: 'Normal', gap: 130, speed: 2.2, spacing: 172, gravity: 0.32, flap: -5.6, variantsFrom: 8,  color: '#FFD23F' },
  hard:   { label: 'Hard',   gap: 112, speed: 2.6, spacing: 156, gravity: 0.36, flap: -5.9, variantsFrom: 4,  color: '#FF6B57' }
};
let diffName = localStorage.getItem('pf.diff') || 'normal';
if (!DIFFS[diffName]) diffName = 'normal';
let D = DIFFS[diffName];
const bestKey = () => 'pf.best.' + diffName;
let best = +localStorage.getItem(bestKey()) || 0;

/* ---------- Power-ups ---------- */
const POWERS = {
  shield: { label: 'Skjold',     color: '#3FA9F5', glow: 'rgba(63,169,245,.55)', dur: 0 },
  slow:   { label: 'Sakte film', color: '#B06BFF', glow: 'rgba(176,107,255,.55)', dur: 6 },
  double: { label: 'Dobbelt',    color: '#FFB800', glow: 'rgba(255,184,0,.55)',   dur: 8 }
};

/* ---------- Tema ---------- */
const THEMES = {
  day: {
    skyTop: '#5BC8F0', skyBot: '#CFF1FF', sun: '#FFF3B0', cloud: 'rgba(255,255,255,.92)', cloudShade: 'rgba(255,255,255,.55)',
    farHill: '#A6E3B0', hill: '#7BD389', hillShade: '#5DBF6E',
    groundTop: '#7FCB4A', groundTop2: '#66B53A', ground: '#EBDDA5', groundStripe: '#DFCF90',
    pipe: '#5EBF3E', pipeLight: '#93E36E', pipeDark: '#3B8F2A', pipeEdge: 'rgba(0,0,0,.18)',
    text: '#FFFFFF', textShadow: 'rgba(0,40,60,.35)', stars: false
  },
  night: {
    skyTop: '#17213F', skyBot: '#3D4F7C', sun: '#FFF7D6', cloud: 'rgba(120,140,190,.55)', cloudShade: 'rgba(80,100,150,.35)',
    farHill: '#3B5A6E', hill: '#2E7A4E', hillShade: '#225C3A',
    groundTop: '#4B9A32', groundTop2: '#3A7C27', ground: '#BFB27E', groundStripe: '#B0A26F',
    pipe: '#4FA836', pipeLight: '#7FCC5C', pipeDark: '#2E7420', pipeEdge: 'rgba(0,0,0,.25)',
    text: '#FFFFFF', textShadow: 'rgba(0,0,20,.5)', stars: true
  }
};
const hr = new Date().getHours();
let themeName = localStorage.getItem('pf.theme') || ((hr >= 20 || hr < 6) ? 'night' : 'day');
let T = THEMES[themeName];

/* ---------- Lyd (Web Audio) ---------- */
const Sound = (() => {
  let ac = null, muted = localStorage.getItem('pf.muted') === '1';
  const ensure = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); };
  const tone = (freq, dur, type = 'sine', vol = 0.18, slideTo = null, delay = 0) => {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  };
  const noise = (dur, vol = 0.25, lp = 1200) => {
    if (muted || !ac) return;
    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = vol;
    s.connect(f).connect(g).connect(ac.destination); s.start();
  };
  return {
    unlock: ensure,
    flap() { tone(540, 0.09, 'triangle', 0.16, 820); },
    point() { tone(880, 0.07, 'sine', 0.16); tone(1320, 0.14, 'sine', 0.16, null, 0.07); },
    power() { tone(660, 0.08, 'triangle', 0.16); tone(990, 0.08, 'triangle', 0.16, null, 0.08); tone(1320, 0.18, 'triangle', 0.16, null, 0.16); },
    shieldPop() { noise(0.12, 0.2, 2500); tone(1200, 0.2, 'sine', 0.14, 300); },
    hit() { noise(0.18, 0.35, 900); tone(160, 0.2, 'sawtooth', 0.16, 60); },
    die() { tone(440, 0.45, 'triangle', 0.14, 110, 0.15); },
    swoosh() { noise(0.16, 0.1, 2400); },
    tick() { tone(1500, 0.03, 'square', 0.05); },
    toggle() { muted = !muted; localStorage.setItem('pf.muted', muted ? '1' : '0'); return muted; },
    get muted() { return muted; }
  };
})();
const buzz = ms => { if ('vibrate' in navigator) try { navigator.vibrate(ms); } catch (e) {} };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Canvas ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = 1, scale = 1, W = LOGICAL_W, H = 560, safeTop = 0, safeBottom = 0;

/* ---------- Tilstand ---------- */
const State = { MENU: 0, READY: 1, PLAY: 2, DEAD: 3, OVER: 4 };
let state = State.MENU;
let score = 0, frame = 0, time = 0;
let groundX = 0, cloudX = 0, farX = 0, hillX = 0;
let bird, pipes = [], particles = [], powers = [], floats = [];
let shake = 0, flash = 0, overT = 0, transitionT = 0, newBest = false;
let active = { shield: false, slow: 0, double: 0 };
let timeScale = 1;
let stars = [];
let deferredPrompt = null;
const hud = {};

function resetBird() { bird = { x: BIRD_X, y: 0, vy: 0, rot: 0, flapT: 99 }; }
function goMenu() { state = State.MENU; resetBird(); pipes = []; particles = []; powers = []; floats = []; score = 0; }
function goReady() {
  state = State.READY; resetBird(); pipes = []; particles = []; powers = []; floats = []; score = 0; newBest = false;
  active = { shield: false, slow: 0, double: 0 }; timeScale = 1; transitionT = 1; Sound.swoosh();
}
function goPlay() { state = State.PLAY; spawnPipe(W + 60); }

function spawnPipe(x) {
  const playH = H - GROUND_H;
  let gap = Math.max(D.gap * 0.72, D.gap - Math.min(score, 30) * 0.9);
  let variant = 'normal';
  if (score >= D.variantsFrom) {
    const r = Math.random();
    if (r < 0.24) variant = 'moving'; else if (r < 0.44) variant = 'narrow';
  }
  if (variant === 'narrow') gap *= 0.8;
  const margin = 40 + safeTop;
  const amp = variant === 'moving' ? 26 : 0;
  const top = margin + amp + Math.random() * (playH - gap - margin - 40 - amp * 2);
  const p = { x, top, baseTop: top, gap, variant, amp, phase: Math.random() * Math.PI * 2, freq: 0.035 + Math.random() * 0.02, scored: false, glow: 0 };
  pipes.push(p);
  // power-up i gapet (ikke i smale rør)
  if (score >= 3 && variant !== 'narrow' && Math.random() < 0.16 && !powers.some(q => q.x > W - 100)) {
    const keys = Object.keys(POWERS);
    const kind = active.shield ? (Math.random() < 0.5 ? 'slow' : 'double') : keys[(Math.random() * keys.length) | 0];
    powers.push({ x: x + PIPE_W / 2, pipe: p, kind, t: Math.random() * 10, taken: false });
  }
}

/* ---------- Partikler ---------- */
function burst(x, y, n, colors, spd, life, grav = 0.12, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life, max: life, grav,
      c: colors[(Math.random() * colors.length) | 0], r: size * (0.5 + Math.random()) });
  }
}
function floatText(x, y, txt, color) { floats.push({ x, y, txt, color, life: 50, max: 50 }); }

/* ---------- Input ---------- */
function flap() {
  Sound.unlock();
  if (state === State.MENU) { goReady(); return; }
  if (state === State.READY) goPlay();
  if (state === State.PLAY) {
    bird.vy = D.flap; bird.flapT = 0;
    Sound.flap(); buzz(8);
    burst(bird.x - 12, bird.y + 6, 4, ['#FFFFFF', '#CFF1FF'], 1.4, 20, 0.04, 2);
    return;
  }
  if (state === State.OVER && overT > 0.7) goReady();
}
function onPointer(e) {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale;
  for (const k in hud) {
    const b = hud[k]; if (!b) continue;
    if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4) {
      Sound.unlock(); b.fn(); Sound.tick(); buzz(6); return;
    }
  }
  flap();
}
canvas.addEventListener('pointerdown', onPointer, { passive: false });
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) lastTime = 0; });

function setDiff(name) { diffName = name; D = DIFFS[name]; localStorage.setItem('pf.diff', name); best = +localStorage.getItem(bestKey()) || 0; }
function toggleTheme() {
  themeName = themeName === 'day' ? 'night' : 'day'; T = THEMES[themeName]; localStorage.setItem('pf.theme', themeName);
  document.querySelector('meta[name=theme-color]').content = T.skyTop; document.documentElement.style.setProperty('--sky', T.skyTop);
}

/* ---------- Oppdatering ---------- */
function update() {
  frame++; time += STEP;
  const ts = (state === State.PLAY && active.slow > 0) ? 0.55 : 1;
  timeScale += (ts - timeScale) * 0.15;
  const moving = (state === State.DEAD || state === State.OVER) ? 0 : D.speed * timeScale;
  groundX = (groundX + moving) % 40;
  cloudX = (cloudX + moving * 0.12) % 360;
  farX = (farX + moving * 0.25) % 240;
  hillX = (hillX + moving * 0.45) % 160;

  if (transitionT > 0) transitionT = Math.max(0, transitionT - 0.06);
  if (shake > 0) shake = Math.max(0, shake - 0.9);
  if (flash > 0) flash = Math.max(0, flash - 0.08);

  const groundY = H - GROUND_H;
  const idleY = groundY * 0.42;

  if (state === State.MENU || state === State.READY) {
    bird.y = idleY + Math.sin(time * 3.2) * 6; bird.rot = Math.sin(time * 3.2 + 1) * 0.08; bird.flapT += 1;
  }

  if (state === State.PLAY) {
    bird.vy = Math.min(bird.vy + D.gravity * timeScale, MAX_FALL);
    bird.y += bird.vy * timeScale; bird.flapT++;
    const target = bird.vy < 0 ? -0.42 : Math.min(1.35, (bird.vy - 1) * 0.26);
    bird.rot += (target - bird.rot) * (bird.vy < 0 ? 0.45 : 0.08);
    if (bird.y < safeTop + 6) { bird.y = safeTop + 6; bird.vy = 0; }

    for (const p of pipes) {
      p.x -= D.speed * timeScale;
      if (p.variant === 'moving') { p.phase += p.freq * timeScale; p.top = p.baseTop + Math.sin(p.phase) * p.amp; }
      if (p.glow > 0) p.glow -= 0.04;
    }
    const last = pipes[pipes.length - 1];
    if (last && last.x < W - D.spacing) spawnPipe(last.x + D.spacing);
    if (pipes.length && pipes[0].x < -PIPE_W - 20) pipes.shift();

    if (active.slow > 0) active.slow = Math.max(0, active.slow - STEP);
    if (active.double > 0) active.double = Math.max(0, active.double - STEP);

    // power-ups
    for (const q of powers) {
      q.x -= D.speed * timeScale; q.t += STEP;
      q.y = q.pipe.top + q.pipe.gap / 2 + Math.sin(q.t * 4) * 4;
      if (!q.taken && Math.hypot(q.x - bird.x, q.y - bird.y) < POWER_R + BIRD_R - 2) collect(q);
    }
    powers = powers.filter(q => !q.taken && q.x > -40);

    // poeng + kollisjon
    for (const p of pipes) {
      if (!p.scored && p.x + PIPE_W / 2 < bird.x) {
        p.scored = true; p.glow = 1;
        const gain = active.double > 0 ? 2 : 1; score += gain;
        Sound.point(); buzz(12);
        burst(bird.x + 16, bird.y, 8, ['#FFD23F', '#FFFFFF', '#FFB800'], 1.4, 26, 0.02, 2.5);
        if (gain === 2) floatText(bird.x + 4, bird.y - 22, '+2', '#FFB800');
        if (score > best) { best = score; newBest = true; localStorage.setItem(bestKey(), best); }
      }
      const inX = bird.x + BIRD_R > p.x && bird.x - BIRD_R < p.x + PIPE_W;
      if (inX && (bird.y - BIRD_R < p.top || bird.y + BIRD_R > p.top + p.gap)) {
        if (active.shield) { useShield(p); } else { die(false); break; }
      }
    }
    if (state === State.PLAY && bird.y + BIRD_R >= groundY) { bird.y = groundY - BIRD_R; die(true); }
  }

  if (state === State.DEAD) {
    bird.vy = Math.min(bird.vy + D.gravity * 1.2, MAX_FALL + 2);
    bird.y += bird.vy; bird.rot = Math.min(1.5, bird.rot + 0.12);
    if (bird.y + BIRD_R >= groundY) {
      bird.y = groundY - BIRD_R;
      burst(bird.x, groundY, 14, [T.ground, T.groundStripe, '#FFFFFF'], 2, 30, 0.14, 3);
      state = State.OVER; overT = 0; Sound.swoosh(); buzz([20, 30, 40]);
    }
  }
  if (state === State.OVER) overT = Math.min(3, overT + STEP);

  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.x += q.vx; q.y += q.vy; q.vy += q.grav; q.vx *= 0.98; q.life--;
    if (q.life <= 0) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.y -= 0.7; f.life--; if (f.life <= 0) floats.splice(i, 1); }
}

function collect(q) {
  q.taken = true; const P = POWERS[q.kind];
  if (q.kind === 'shield') active.shield = true; else active[q.kind] = P.dur;
  Sound.power(); buzz([10, 20, 10]);
  burst(q.x, q.y, 14, [P.color, '#FFFFFF'], 2.2, 30, 0.04, 2.5);
  floatText(bird.x + 4, bird.y - 26, P.label, P.color);
}
function useShield(p) {
  active.shield = false; Sound.shieldPop(); buzz([20, 10, 30]);
  shake = reduceMotion ? 0 : 5; flash = 0.35;
  burst(bird.x, bird.y, 18, ['#3FA9F5', '#FFFFFF', '#9BD6FF'], 2.6, 32, 0.02, 3);
  // dytt fuglen til midten av gapet så den ikke treffer igjen umiddelbart
  bird.y = p.top + p.gap / 2; bird.vy = -1.5;
  p.scored = true; // ikke gi poeng for et rør du «krasjet gjennom»
}
function die(onGround) {
  Sound.hit(); if (!onGround) Sound.die();
  buzz([40, 20, 60]); shake = reduceMotion ? 0 : 9; flash = 1;
  burst(bird.x, bird.y, 12, ['#3FA9F5', '#FFFFFF', '#FF8A3D'], 2.2, 28, 0.12, 3);
  active = { shield: false, slow: 0, double: 0 };
  if (onGround) { state = State.OVER; overT = 0; bird.rot = 1.5; }
  else { state = State.DEAD; bird.vy = Math.max(bird.vy, -3); }
}

/* ---------- Tegnehjelpere ---------- */
function rr(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
}
function text(txt, x, y, size, opts = {}) {
  const { weight = 700, align = 'center', color = T.text, shadow = true, alpha = 1, baseline = 'middle' } = opts;
  ctx.font = `${weight} ${size}px Fredoka, system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = baseline; ctx.globalAlpha = alpha;
  if (shadow) { ctx.fillStyle = T.textShadow; ctx.fillText(txt, x, y + Math.max(1.5, size * 0.07)); }
  ctx.fillStyle = color; ctx.fillText(txt, x, y); ctx.globalAlpha = 1;
}

function drawBackground(groundY) {
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, T.skyTop); g.addColorStop(1, T.skyBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY);

  if (T.stars) {
    for (const s of stars) { ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * 2 + s.p)); ctx.fillStyle = '#FFF7D6'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  // sol / måne med glød
  const sx = W - 52, sy = safeTop + 132;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 70);
  sg.addColorStop(0, T.stars ? 'rgba(255,247,214,.35)' : 'rgba(255,243,176,.55)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - 70, sy - 70, 140, 140);
  ctx.fillStyle = T.sun; ctx.beginPath(); ctx.arc(sx, sy, 22, 0, 7); ctx.fill();
  if (T.stars) { ctx.fillStyle = T.skyTop; ctx.beginPath(); ctx.arc(sx + 9, sy - 6, 18, 0, 7); ctx.fill(); }

  // skyer
  for (let i = -1; i < 2; i++) {
    const cx = i * 360 - cloudX;
    cloud(cx + 30, groundY - 250, 1.0); cloud(cx + 160, groundY - 300, 0.75); cloud(cx + 260, groundY - 210, 1.2);
  }
  // fjerne åser
  ctx.fillStyle = T.farHill;
  ctx.beginPath(); ctx.moveTo(-10, groundY);
  for (let x = -10; x <= W + 10; x += 6) ctx.lineTo(x, groundY - 44 - Math.sin((x + farX) / 240 * Math.PI * 2) * 22 - Math.cos((x + farX) / 90) * 8);
  ctx.lineTo(W + 10, groundY); ctx.closePath(); ctx.fill();
  // nære åser
  const hg = ctx.createLinearGradient(0, groundY - 40, 0, groundY);
  hg.addColorStop(0, T.hill); hg.addColorStop(1, T.hillShade);
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.moveTo(-10, groundY);
  for (let x = -10; x <= W + 10; x += 6) ctx.lineTo(x, groundY - 14 - Math.abs(Math.sin((x + hillX) / 160 * Math.PI)) * 30);
  ctx.lineTo(W + 10, groundY); ctx.closePath(); ctx.fill();
}
function cloud(x, y, s) {
  const c = (dx, dy, r) => { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); };
  ctx.fillStyle = T.cloudShade; c(0, 4, 14); c(18, 2, 20); c(38, 4, 14);
  ctx.fillStyle = T.cloud; c(0, 0, 14); c(18, -4, 20); c(38, 0, 14);
}
function drawGround(groundY) {
  ctx.fillStyle = T.ground; ctx.fillRect(0, groundY, W, GROUND_H);
  const g = ctx.createLinearGradient(0, groundY, 0, groundY + 14);
  g.addColorStop(0, T.groundTop); g.addColorStop(1, T.groundTop2);
  ctx.fillStyle = g; ctx.fillRect(0, groundY, W, 14);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0, groundY + 14, W, 2);
  ctx.fillStyle = T.groundStripe;
  for (let x = -40 - groundX; x < W + 40; x += 40) { rr(x, groundY + 26, 22, 6, 3); ctx.fill(); rr(x + 24, groundY + 44, 12, 6, 3); ctx.fill(); }
  ctx.fillStyle = 'rgba(0,0,0,.05)';
  for (let x = -40 - groundX * 1.0; x < W + 40; x += 40) { ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x + 16, groundY); ctx.lineTo(x + 8, groundY + 14); ctx.lineTo(x - 8, groundY + 14); ctx.closePath(); ctx.fill(); }
}

function drawPipe(p, groundY) {
  const x = p.x;
  const accent = p.variant === 'moving' ? '#FF8A3D' : p.variant === 'narrow' ? '#B06BFF' : null;
  const body = (y, h) => {
    const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    g.addColorStop(0, T.pipeDark); g.addColorStop(0.18, T.pipeLight); g.addColorStop(0.55, T.pipe); g.addColorStop(1, T.pipeDark);
    ctx.fillStyle = g; ctx.fillRect(x, y, PIPE_W, h);
    ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(x + 8, y, 6, h, 3); ctx.fill();
  };
  const cap = y => {
    ctx.fillStyle = 'rgba(0,0,0,.15)'; rr(x - 5, y + 3, PIPE_W + 10, PIPE_CAP_H, 7); ctx.fill();
    const g = ctx.createLinearGradient(x - 5, 0, x + PIPE_W + 5, 0);
    g.addColorStop(0, T.pipeDark); g.addColorStop(0.18, T.pipeLight); g.addColorStop(0.55, T.pipe); g.addColorStop(1, T.pipeDark);
    ctx.fillStyle = g; rr(x - 5, y, PIPE_W + 10, PIPE_CAP_H, 7); ctx.fill();
    if (accent) {
      ctx.fillStyle = accent; rr(x - 5, y, PIPE_W + 10, PIPE_CAP_H, 7); ctx.fill();
      ctx.save(); rr(x - 5, y, PIPE_W + 10, PIPE_CAP_H, 7); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(x + PIPE_W - 14, y, 20, PIPE_CAP_H);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x - 5, y, 22, PIPE_CAP_H); ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(x + 3, y + 4, 10, PIPE_CAP_H - 8, 4); ctx.fill();
    ctx.strokeStyle = T.pipeEdge; ctx.lineWidth = 1.5; rr(x - 5, y, PIPE_W + 10, PIPE_CAP_H, 7); ctx.stroke();
  };
  body(-10, p.top - PIPE_CAP_H + 12); cap(p.top - PIPE_CAP_H);
  const by = p.top + p.gap;
  body(by + PIPE_CAP_H - 2, groundY - by - PIPE_CAP_H + 2); cap(by);
  if (p.glow > 0) { ctx.globalAlpha = p.glow * 0.45; ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - 5, p.top, PIPE_W + 10, p.gap); ctx.globalAlpha = 1; }
}

function drawPower(q) {
  const P = POWERS[q.kind];
  const pulse = 1 + Math.sin(q.t * 5) * 0.06;
  const g = ctx.createRadialGradient(q.x, q.y, 4, q.x, q.y, POWER_R * 2.2);
  g.addColorStop(0, P.glow); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(q.x - 30, q.y - 30, 60, 60);
  ctx.save(); ctx.translate(q.x, q.y); ctx.scale(pulse, pulse);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.arc(0, 2, POWER_R, 0, 7); ctx.fill();
  ctx.fillStyle = P.color; ctx.beginPath(); ctx.arc(0, 0, POWER_R, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-3, -5, 6, 3.5, -0.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  if (q.kind === 'shield') { ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(6, -3.5); ctx.lineTo(5, 3); ctx.lineTo(0, 7); ctx.lineTo(-5, 3); ctx.lineTo(-6, -3.5); ctx.closePath(); ctx.stroke(); }
  else if (q.kind === 'slow') { ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(0, 0.5); ctx.lineTo(3, 2.5); ctx.stroke(); }
  else { text('×2', 0, 0.5, 11, { color: '#FFFFFF', shadow: false }); }
  ctx.restore();
}

function drawBird() {
  ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
  // skygge
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.beginPath(); ctx.ellipse(1, 4, 15, 12, 0, 0, 7); ctx.fill();
  // kropp
  const bg = ctx.createRadialGradient(-5, -6, 2, 0, 0, 18);
  bg.addColorStop(0, '#6FC4FF'); bg.addColorStop(1, '#2F8FDD');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(0, 0, 15, 12, 0, 0, 7); ctx.fill();
  // mage
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.ellipse(-3, 4.5, 8.5, 5.5, 0, 0, 7); ctx.fill();
  // vinge (flakse-animasjon)
  const t = Math.min(bird.flapT, 18) / 18;
  const wingA = (state === State.PLAY ? Math.sin(t * Math.PI) * -1.1 : Math.sin(time * 9) * 0.35) + 0.35;
  ctx.save(); ctx.translate(-5, -1); ctx.rotate(wingA);
  ctx.fillStyle = '#2B7FC4'; ctx.beginPath(); ctx.ellipse(-4, 2, 9, 5, 0.25, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.ellipse(-5, 0.5, 6, 2.2, 0.25, 0, 7); ctx.fill();
  ctx.restore();
  // øye
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(6, -4, 5.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#1B1C26'; ctx.beginPath(); ctx.arc(7.5, -4, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(8.4, -5, 0.9, 0, 7); ctx.fill();
  // nebb
  ctx.fillStyle = '#FF8A3D'; ctx.beginPath(); ctx.moveTo(10, 1); ctx.quadraticCurveTo(20, -1, 21, 2.5); ctx.quadraticCurveTo(20, 6, 10, 5.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#E86F22'; ctx.beginPath(); ctx.moveTo(11, 3.6); ctx.lineTo(20, 3.2); ctx.lineTo(19, 4.6); ctx.lineTo(11, 5.4); ctx.closePath(); ctx.fill();
  ctx.restore();
  // skjold-ring (roterer ikke med fuglen)
  if (active.shield) {
    const r = BIRD_R + 9 + Math.sin(time * 6) * 1.2;
    ctx.strokeStyle = 'rgba(63,169,245,.9)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(bird.x, bird.y, r, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(63,169,245,.14)'; ctx.fill();
  }
}

function drawParticles() {
  for (const q of particles) { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  for (const f of floats) text(f.txt, f.x, f.y, 13, { color: f.color, alpha: Math.min(1, f.life / 20) });
  ctx.globalAlpha = 1;
}

function button(key, x, y, w, h, label, fn, opts = {}) {
  const { fill = '#FFD23F', color = '#2B2400', size = 13, active = true } = opts;
  hud[key] = { x, y, w, h, fn };
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(x, y + 3, w, h, h / 2); ctx.fill();
  ctx.fillStyle = active ? fill : 'rgba(255,255,255,.45)'; rr(x, y, w, h, h / 2); ctx.fill();
  if (active) { ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(x + 4, y + 3, w - 8, h * 0.38, h / 2); ctx.fill(); }
  text(label, x + w / 2, y + h / 2 + 0.5, size, { color: active ? color : 'rgba(43,36,0,.7)', shadow: false, weight: 600 });
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(x, y + 6, w, h, 18); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.96)'; rr(x, y, w, h, 18); ctx.fill();
}
function medalFor(s) {
  if (s >= 40) return ['#E3EEF8', '#9FB8CC', 'Platina'];
  if (s >= 30) return ['#FFD23F', '#D19A00', 'Gull'];
  if (s >= 20) return ['#E4E4E4', '#9A9A9A', 'Sølv'];
  if (s >= 10) return ['#E0955C', '#9C5B2A', 'Bronse'];
  return null;
}
function drawMedal(x, y, m) {
  const [c, d] = m;
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.arc(x, y + 2, 20, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(x - 6, y - 6, 2, x, y, 20); g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.35, c); g.addColorStop(1, d);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
  ctx.strokeStyle = d; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.stroke();
  // stjerne
  ctx.fillStyle = d; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 4 : 9, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  if (!reduceMotion) { const sp = (time * 1.4) % 1; if (sp < 0.25) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x - 12 + sp * 96, y - 12, 2.5, 0, 7); ctx.fill(); } }
}

function drawActiveHud(y) {
  const items = [];
  if (active.shield) items.push(['shield', 1]);
  if (active.slow > 0) items.push(['slow', active.slow / POWERS.slow.dur]);
  if (active.double > 0) items.push(['double', active.double / POWERS.double.dur]);
  if (!items.length) return;
  const w = 118, h = 20, gapY = 6;
  let yy = y;
  for (const [k, frac] of items) {
    const P = POWERS[k], x = (W - w) / 2;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(x, yy, w, h, h / 2); ctx.fill();
    ctx.fillStyle = P.color; ctx.save(); rr(x, yy, w, h, h / 2); ctx.clip(); ctx.fillRect(x, yy, w * (k === 'shield' ? 1 : frac), h); ctx.restore();
    text(P.label, x + w / 2, yy + h / 2 + 0.5, 11, { shadow: false, weight: 600 });
    yy += h + gapY;
  }
}

function render() {
  const groundY = H - GROUND_H;
  ctx.save();
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawBackground(groundY);
  for (const p of pipes) drawPipe(p, groundY);
  for (const q of powers) drawPower(q);
  drawGround(groundY);
  drawParticles();
  drawBird();
  for (const k in hud) delete hud[k];

  const topY = safeTop + 26;

  if (state === State.MENU) {
    const ty = topY + 40 + Math.sin(time * 2.4) * 3;
    text('Pixelfugl', W / 2, ty, 40, { color: '#FFD23F' });
    text('Trykk for å flakse', W / 2, groundY * 0.58, 15, { weight: 600 });
    if (best > 0) text(`Beste (${D.label.toLowerCase()}): ${best}`, W / 2, groundY * 0.58 + 24, 12, { weight: 600, color: '#FFD23F' });
    // vanskelighetsgrad
    const bw = 76, bh = 30, gapX = 8, total = bw * 3 + gapX * 2, x0 = (W - total) / 2, y0 = groundY * 0.58 + 52;
    text('Vanskelighet', W / 2, y0 - 12, 11, { weight: 600, alpha: 0.85 });
    let i = 0;
    for (const k in DIFFS) { const on = k === diffName; button('d_' + k, x0 + i * (bw + gapX), y0, bw, bh, DIFFS[k].label, () => setDiff(k), { fill: DIFFS[k].color, active: on, size: 13 }); i++; }
    // nedre knapper
    button('sound', 18, groundY + 30, 100, 32, Sound.muted ? 'Lyd av' : 'Lyd på', () => Sound.toggle(), { active: !Sound.muted });
    button('theme', W - 118, groundY + 30, 100, 32, themeName === 'day' ? 'Dag' : 'Natt', toggleTheme, { fill: themeName === 'day' ? '#FFD23F' : '#B9C6FF' });
  }

  if (state === State.READY) {
    text('Klar?', W / 2, topY + 40, 32, { color: '#FFD23F' });
    text(D.label, W / 2, topY + 70, 13, { weight: 600, color: D.color });
    const hy = groundY * 0.42 + 30 + Math.sin(time * 6) * 3;
    ctx.fillStyle = 'rgba(255,255,255,.9)'; rr(W / 2 + 36, hy, 20, 30, 10); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(W / 2 + 44, hy + 5, 4, 10, 2); ctx.fill();
    text('Trykk', W / 2, groundY * 0.42 + 78, 14, { weight: 600 });
  }

  if (state === State.PLAY || state === State.DEAD) {
    text(String(score), W / 2, topY + 16, 40);
    drawActiveHud(topY + 46);
  }

  if (state === State.OVER) {
    const e = Math.min(1, overT / 0.5), ease = 1 - Math.pow(1 - e, 3);
    const pw = 236, ph = 132, pxx = (W - pw) / 2, py = groundY * 0.48 - ph / 2 + (1 - ease) * 80;
    text('Spillet er over', W / 2, py - 40 - (1 - ease) * 40, 24, { color: '#FF8A3D' });
    panel(pxx, py, pw, ph);
    const m = medalFor(score);
    if (m) { drawMedal(pxx + 48, py + 62, m); text(m[2], pxx + 48, py + 100, 11, { color: '#5B5540', shadow: false, weight: 600 }); }
    else { ctx.fillStyle = '#E8E4D2'; ctx.beginPath(); ctx.arc(pxx + 48, py + 62, 20, 0, 7); ctx.fill(); text('Ingen medalje', pxx + 48, py + 100, 10, { color: '#8E8760', shadow: false, weight: 600 }); }
    const shown = Math.min(score, Math.floor(Math.max(0, overT - 0.5) * 30));
    text('Poeng', pxx + pw - 26, py + 30, 12, { align: 'right', color: '#8E8760', shadow: false, weight: 600 });
    text(String(shown), pxx + pw - 26, py + 54, 28, { align: 'right', color: '#2B2400', shadow: false });
    text('Beste', pxx + pw - 26, py + 84, 12, { align: 'right', color: '#8E8760', shadow: false, weight: 600 });
    text(String(best), pxx + pw - 26, py + 108, 28, { align: 'right', color: '#2B2400', shadow: false });
    if (newBest && shown === score) {
      ctx.fillStyle = '#FF6B57'; rr(pxx + pw - 118, py + 74, 34, 18, 9); ctx.fill();
      text('Ny!', pxx + pw - 101, py + 83.5, 11, { shadow: false, weight: 600 });
    }
    text(D.label, pxx + 48, py + 22, 11, { color: D.color, shadow: false, weight: 600 });
    if (overT > 0.9) text('Trykk for å prøve igjen', W / 2, py + ph + 30, 14, { weight: 600, alpha: 0.6 + 0.4 * Math.sin(time * 5) });
  }

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  if (transitionT > 0) { ctx.fillStyle = `rgba(0,0,0,${transitionT * 0.45})`; ctx.fillRect(0, 0, W, H); }
  if (state === State.PLAY && active.slow > 0) {
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
    vg.addColorStop(0, 'rgba(176,107,255,0)'); vg.addColorStop(1, 'rgba(176,107,255,.28)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

/* ---------- Størrelse ---------- */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = vw / LOGICAL_W; W = LOGICAL_W; H = Math.round(vh / scale);
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);visibility:hidden';
  document.body.appendChild(probe);
  const pr = probe.getBoundingClientRect();
  safeTop = Math.round(pr.top / scale); safeBottom = Math.round((vh - pr.bottom) / scale);
  probe.remove();
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
  stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * (H - GROUND_H - 140), r: Math.random() < 0.3 ? 1.6 : 1, p: Math.random() * 10 }));
  if (bird && state !== State.PLAY) bird.y = (H - GROUND_H) * 0.42;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- Løkke ---------- */
let lastTime = 0, acc = 0;
function loop(t) {
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / 1000; lastTime = t;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}

/* ---------- PWA ---------- */
const installBtn = document.getElementById('install');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBtn.classList.add('show'); });
installBtn.addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.classList.remove('show'); });
window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

document.documentElement.style.setProperty('--sky', T.skyTop);
document.querySelector('meta[name=theme-color]').content = T.skyTop;
resize(); goMenu();
const start = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("700 20px Fredoka"), document.fonts.load("600 14px Fredoka")]).finally(start); else start();
</script>
</body>
