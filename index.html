<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#A8C8CF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixelfugl">
<meta name="description" content="Pixelfugl – et moderne flakse-spill. Trykk for å flakse.">
<title>Pixelfugl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/storybook-bold.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Fredoka (SIL OFL 1.1, se fonts/OFL.txt) – selvhostet variabel font, dekker vekt 300–700 og æøå */
  @font-face {
    font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap;
    src: url(fonts/fredoka-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Storybook'; font-style: normal; font-weight: 700; font-display: swap;
    src: url(fonts/storybook-bold.ttf) format('truetype');
  }
  :root { --sky: #A8C8CF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: var(--sky);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: 'Fredoka', system-ui, sans-serif;
  }
  body { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #controls { position: absolute; inset: 0; pointer-events: none; }
  #controls button {
    position: absolute; pointer-events: auto; cursor: pointer; background: transparent;
    border: 0; border-radius: 12px; color: transparent; font-size: 0;
    touch-action: manipulation;
  }
  #controls button:focus-visible { outline: 3px solid #EFC579; outline-offset: 3px; }
  #install {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    display: none; border: 0; cursor: pointer; border-radius: 999px;
    font: 500 12px/1 'Fredoka', system-ui, sans-serif; color: #49382E;
    background: #F5EAD5; padding: 10px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  #install:active { transform: translateX(-50%) scale(.96); }
  body[data-screen="menu"] #install.show { display: block; }
</style>
</head>
<body>
<canvas id="game" aria-label="Pixelfugl spill" role="img"></canvas>
<div id="controls" role="group" aria-label="Spillkontroller"></div>
<button id="install" type="button">Installer Pixelfugl</button>

<script src="js/config.js" defer></script>
<script src="js/sound.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/render.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
