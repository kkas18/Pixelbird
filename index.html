<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixelfugl">
<meta name="description" content="Pixelfugl – et arkadespill der en blåmeis flyr hjem gjennom en blå labyrint og spiser prikker. Trykk for å flakse.">
<title>Pixelfugl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/arkade-favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="icons/arkade-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/arkade-apple-touch.png">
<style>
  /* svart: samme farge som oppstartsskjermen (manifest) og spillet, så overgangen er sømløs */
  :root { --sky: #000000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: var(--sky);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: system-ui, sans-serif;
  }
  body { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #controls { position: absolute; inset: 0; pointer-events: none; }
  #controls button {
    position: absolute; pointer-events: auto; cursor: pointer; background: transparent;
    border: 0; border-radius: 12px; color: transparent; font-size: 0;
    touch-action: manipulation;
  }
  #controls button:focus-visible { outline: 3px solid #FFE042; outline-offset: 3px; }
  /* installer-knappen (bare i nettleseren): en arkadeknapp med dobbel blå ramme og gul tekst */
  #install {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: none; cursor: pointer; border-radius: 6px; border: 2px solid #2B3CFF;
    font: 700 12px/1 ui-monospace, 'Courier New', monospace; letter-spacing: .08em; text-transform: uppercase;
    color: #FFE042; background: #03082A; padding: 9px 14px;
    box-shadow: 0 0 0 3px #000, 0 0 0 5px #2B3CFF;
  }
  #install:active { transform: translateX(-50%) scale(.96); }
  body[data-screen="menu"] #install.show { display: block; }
</style>
</head>
<body>
<canvas id="game" aria-label="Pixelfugl spill" role="img"></canvas>
<div id="controls" role="group" aria-label="Spillkontroller"></div>
<button id="install" type="button">Installer Pixelfugl</button>

<script src="js/config.js" defer></script>
<script src="js/pixel.js" defer></script>
<script src="js/sound.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/render.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
