<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8FD3F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixelfugl">
<meta name="description" content="Pixelfugl – et moderne flakse-spill. Trykk for å flakse.">
<title>Pixelfugl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Fredoka (SIL OFL 1.1, se fonts/OFL.txt) – selvhostet variabel font, dekker vekt 300–700 og æøå */
  @font-face {
    font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap;
    src: url(fonts/fredoka-latin.woff2) format('woff2');
  }
  :root { --sky: #8FD3F4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: var(--sky);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: 'Fredoka', system-ui, sans-serif;
  }
  body { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #install {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: none; border: 0; cursor: pointer; border-radius: 999px;
    font: 600 15px/1 'Fredoka', system-ui, sans-serif; color: #2B2400;
    background: #FFD23F; padding: 14px 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,.22), inset 0 -3px 0 rgba(0,0,0,.12);
  }
  #install:active { transform: translateX(-50%) scale(.96); }
  #install.show { display: block; }
</style>
</head>
<body>
<canvas id="game" aria-label="Pixelfugl spill" role="img"></canvas>
<button id="install" type="button">Installer Pixelfugl</button>

<script>
'use strict';
/* ============================================================
   PIXELFUGL v3.3 – koselig bjørkeskog
   – Tidsbasert fysikk (px/s, px/s²) med fast tidssteg 120 Hz,
     interpolert tegning mellom steg (jevnt på 60/90/120 Hz)
   – Forhåndstegnede parallakse-lag (fjell, fjord, hytter, bjørkeskog), bjørkestammer som hinder,
     fugl med strikket skjerf (Verlet-fysikk), ansiktsuttrykk og myke partikler
   – Generert koselig musikk (spilledåse, pad, F-dur 88 BPM), myke lydeffekter og naturlyder (Web Audio)
   Logisk bredde 288 px, høyde følger skjermen.
   ============================================================ */

const LOGICAL_W = 288;
const STEP = 1 / 120;               // fysikk-steg (sekunder)
// hinderne er bjørkestammer («pipe» i koden): bredde, endeflate (snitt + mosekant) og hvor langt mosen stikker ut
const PIPE_W = 56, END_H = 12, TRUNK_LIP = 4;
const GROUND_H = 92;
const BIRD_X = 78, BIRD_R = 11, POWER_R = 13;
const TERMINAL = 560;               // px/s
const AIR_DRAG = 0.35;              // 1/s
const ZONE_H = 400;                 // fast høyde på sonen der gapene kan ligge – lik på alle skjermer
const MIN_GAP = 92;                 // absolutt minste åpning (px), uansett nivå og variant
const SHIELD_GRACE = 0.8;           // sekunder uten kollisjon etter at skjoldet tar et treff
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* localStorage kan kaste (privat modus, blokkerte data) – spillet skal starte uansett */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- Vanskelighetsgrader (alle hastigheter i px/s) ----------
   shift = maks forskjell i gap-midtpunkt mellom to rør på rad */
const DIFFS = {
  lett:   { label: 'Lett',   gap: 152, speed: 118, spacing: 192, gravity: 1050, flap: -330, shift: 150, variantsFrom: 14, color: '#9BD883', ink: '#4E8F3E' },
  normal: { label: 'Normal', gap: 130, speed: 136, spacing: 172, gravity: 1180, flap: -345, shift: 135, variantsFrom: 8,  color: '#FFD27A', ink: '#B97C12' },
  hard:   { label: 'Hard',   gap: 112, speed: 160, spacing: 156, gravity: 1320, flap: -362, shift: 120, variantsFrom: 4,  color: '#FFA28C', ink: '#CC5238' }
};
let diffName = store.get('pf.diff') || 'normal';
if (!DIFFS[diffName]) diffName = 'normal';
let D = DIFFS[diffName];
const bestKey = () => 'pf.best.' + diffName;
let best = +store.get(bestKey()) || 0;

// såpeboble (skjold), snegl (sakte film) og gyllen eikenøtt (dobbel poeng)
const POWERS = {
  shield: { label: 'Såpeboble',   color: '#7FD0F2', glow: 'rgba(127,208,242,.5)', dur: 0 },
  slow:   { label: 'Sneglefart',  color: '#B49BE8', glow: 'rgba(180,155,232,.5)', dur: 6 },
  double: { label: 'Eikenøtt ×2', color: '#F2B544', glow: 'rgba(242,181,68,.5)',  dur: 8 }
};

/* ---------- Tema: varm pastell (dag) og koselig kveld (natt) ----------
   ink = varm kontur som brukes på tegningene i stedet for svarte skygger */
const THEMES = {
  day: {
    skyTop: '#8FD3F4', skyMid: '#C4E8F4', skyBot: '#FFE4C8', sun: '#FFF1C4', sunGlow: 'rgba(255,214,150,.55)',
    cloud: '#FFFFFF', cloudShade: '#F6DCD3',
    mountainFar: '#BCCBEA', mountainNear: '#A3B7DE', snow: '#FBF8FF', fjord: '#A6D9EC', fjordLight: '#E3F6FC',
    hillFar: '#AEDB9F', hillNear: '#8CCB86', forest: '#86C08A', crown: '#A6D68E', crownWarm: '#F4C95D',
    cabin: '#D0583F', cabinDark: '#A8432F', roof: '#5B4636', window: '#CFEFF7', windowLit: false,
    grass: '#94D46C', grassDark: '#72B955', soil: '#D3AE84', soilDark: '#B48C64', stone: '#E6DACA',
    trunk: '#FBF8F1', trunkShade: '#D8CFC2', bark: '#3F3936', cut: '#F4DCA8', cutRing: '#D7B27A', moss: '#86C35C',
    ink: '#5B4636', text: '#FFFDF6', textShadow: 'rgba(91,70,54,.45)', vignette: 'rgba(255,178,140,.16)', night: false
  },
  night: {
    skyTop: '#23264F', skyMid: '#45457F', skyBot: '#8C77B2', sun: '#FFF3C8', sunGlow: 'rgba(255,236,190,.28)',
    cloud: '#8581BA', cloudShade: '#66629A',
    mountainFar: '#4D4F86', mountainNear: '#414379', snow: '#BDB9E6', fjord: '#3D4F88', fjordLight: '#7488C4',
    hillFar: '#3F6A6B', hillNear: '#365E5A', forest: '#2F5A56', crown: '#3F7262', crownWarm: '#8F7A45',
    cabin: '#A0473A', cabinDark: '#7E372D', roof: '#2E2438', window: '#FFD47E', windowLit: true,
    grass: '#55935D', grassDark: '#447A4B', soil: '#8C705E', soilDark: '#71594B', stone: '#A39790',
    trunk: '#D6D1E3', trunkShade: '#9C95B8', bark: '#2C2834', cut: '#DCC7A2', cutRing: '#B69C76', moss: '#5B9A5E',
    ink: '#2C2442', text: '#FFF7E8', textShadow: 'rgba(20,14,40,.55)', vignette: 'rgba(14,10,44,.38)', night: true
  }
};
const hr = new Date().getHours();
let themeName = store.get('pf.theme') || ((hr >= 20 || hr < 6) ? 'night' : 'day');
if (!THEMES[themeName]) themeName = 'day';
let T = THEMES[themeName];

/* ============================================================
   LYD + MUSIKK (Web Audio, alt syntetisert)
   Koselig lydbilde: spilledåse, myk pad og rund bass i F-dur (88 BPM),
   myke lydeffekter, og naturlyder (fuglekvitter/vind om dagen,
   sirisser/ugle om kvelden). Felles etterklang og en begrenser
   (kompressor) på slutten hindrer klipping når mange lyder overlapper.
   ============================================================ */
const Sound = (() => {
  let ac = null, master, sfxGain, musGain, musFilter, ambGain, reverb, musSend, sfxSend, noiseBuf;
  let sfxMuted = store.get('pf.muted') === '1';
  let musMuted = store.get('pf.music') === '1';
  let night = false;
  const MUS_VOL = 0.5, AMB_VOL = 0.55;
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  // syntetisk romklang: stereo støy som dør ut eksponentielt (~2 s), litt mørkere mot slutten
  function makeReverb() {
    const len = Math.floor(ac.sampleRate * 2.2), buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let lp = 0;
      for (let i = 0; i < len; i++) { const t = i / len; lp += ((Math.random() * 2 - 1) - lp) * (0.9 - t * 0.6); d[i] = lp * Math.pow(1 - t, 3.2); }
    }
    const c = ac.createConvolver(); c.buffer = buf; return c;
  }
  function ensure() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const limiter = ac.createDynamicsCompressor();
      limiter.threshold.value = -10; limiter.knee.value = 6; limiter.ratio.value = 12; limiter.attack.value = 0.003; limiter.release.value = 0.2;
      master = ac.createGain(); master.gain.value = 1; master.connect(limiter).connect(ac.destination);
      reverb = makeReverb(); const wet = ac.createGain(); wet.gain.value = 0.5; reverb.connect(wet).connect(master);
      sfxGain = ac.createGain(); sfxGain.gain.value = sfxMuted ? 0 : 1; sfxGain.connect(master);
      sfxSend = ac.createGain(); sfxSend.gain.value = 0.18; sfxGain.connect(sfxSend).connect(reverb);
      musFilter = ac.createBiquadFilter(); musFilter.type = 'lowpass'; musFilter.frequency.value = 2400; musFilter.Q.value = 0.5;
      musGain = ac.createGain(); musGain.gain.value = musMuted ? 0 : MUS_VOL;
      musGain.connect(musFilter).connect(master);
      musSend = ac.createGain(); musSend.gain.value = 0.35; musFilter.connect(musSend).connect(reverb);
      ambGain = ac.createGain(); ambGain.gain.value = musMuted ? 0 : AMB_VOL; ambGain.connect(master);
      const as = ac.createGain(); as.gain.value = 0.3; ambGain.connect(as).connect(reverb);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      Ambience.start();
    }
    if (ac.state === 'suspended') ac.resume();
  }

  /* ---------- Instrumenter ---------- */
  // enkel stemme med attack/decay-kurve (eksponentiell, ingen klikk)
  function tone(dest, freq, t0, dur, type, vol, { attack = 0.005, slide = 0, lp = 0, pan = 0 } = {}) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = o;
    if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; node.connect(f); node = f; }
    if (pan) { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); node = p; }
    node.connect(g).connect(dest); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  // spilledåse/kalimba: grunntone + svakere overtoner som dør raskere ut
  function musicBox(dest, freq, t0, vol, dur = 1.5, pan = 0) {
    tone(dest, freq, t0, dur, 'sine', vol, { attack: 0.004, pan });
    tone(dest, freq * 2.003, t0, dur * 0.45, 'sine', vol * 0.28, { attack: 0.003, pan });
    tone(dest, freq * 4.21, t0, dur * 0.14, 'sine', vol * 0.1, { attack: 0.002, pan });
  }
  // myk pad: to svakt forstemte triangelbølger per tone, langsom inn/ut
  function pad(dest, notes, t0, dur, vol) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = 0.3;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.7); g.gain.setValueAtTime(vol, t0 + dur - 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.4);
    f.connect(g).connect(dest);
    for (const n of notes) for (const det of [-5, 5]) {
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = midi(n); o.detune.value = det;
      o.connect(f); o.start(t0); o.stop(t0 + dur + 0.5);
    }
  }
  function noise(dest, t0, dur, vol, { hp = 0, lp = 0, bp = 0, q = 1, sweep = 0, pan = 0 } = {}) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 1;
    const g = ac.createGain(); let node = s;
    const filt = (type, f) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.setValueAtTime(f, t0); b.Q.value = q; node.connect(b); node = b; return b; };
    if (hp) filt('highpass', hp);
    if (lp) filt('lowpass', lp);
    if (bp) { const b = filt('bandpass', bp); if (sweep) b.frequency.exponentialRampToValueAtTime(sweep, t0 + dur); }
    if (pan) { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); node = p; }
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.01, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    node.connect(g).connect(dest);
    s.start(t0, Math.random() * 1.5); s.stop(t0 + dur + 0.05);
  }

  /* ---------- Musikk: 8 takter i F-dur, 88 BPM, svak swing ---------- */
  const Music = (() => {
    const BPM = 88, STEPS = 64, eighth = 60 / BPM / 2, SWING = 0.16;
    // Fmaj7 – Dm7 – B♭maj7 – Csus4 | Fmaj7 – Am7 – B♭add9 – C7
    const CHORDS = [[53, 57, 60, 64], [50, 57, 60, 65], [46, 53, 57, 62], [48, 53, 55, 60], [53, 57, 60, 64], [45, 52, 55, 60], [46, 53, 57, 60], [48, 52, 55, 58]];
    const ROOTS = [41, 38, 46, 48, 41, 45, 46, 48];
    // melodi for spilledåse (0 = pause), to fraser à 4 takter
    const LEAD = [
      81, 0, 84, 0, 81, 79, 77, 0,   74, 0, 77, 0, 81, 0, 79, 0,   77, 0, 74, 0, 77, 79, 81, 0,   79, 0, 0, 0, 72, 0, 0, 0,
      81, 0, 84, 0, 86, 0, 84, 81,   84, 0, 81, 0, 79, 0, 76, 0,   77, 0, 74, 77, 81, 0, 79, 77,  79, 0, 0, 0, 0, 0, 0, 0
    ];
    let step = 0, nextTime = 0, timer = null, playing = false, mode = 'menu';

    function schedule(i, t) {
      const bar = (i >> 3) % 8, sub = i & 7, play = mode === 'play';
      if (sub & 1) t += eighth * SWING;   // lett swing på åttendedelene
      if (sub === 0) pad(musGain, CHORDS[bar], t, eighth * 8, night ? 0.05 : 0.04);
      // melodi: full i spill, bare på slagene i menyen; en oktav lavere og roligere om kvelden
      const ln = LEAD[i % STEPS];
      if (ln && (play || sub % 2 === 0)) musicBox(musGain, midi(ln - (night ? 12 : 0)), t, play ? 0.13 : 0.1, night ? 2 : 1.5, (sub % 4 - 1.5) * 0.12);
      if (play) {
        if (sub === 0 || sub === 4) tone(musGain, midi(ROOTS[bar]), t, eighth * 3.2, 'triangle', 0.22, { attack: 0.01, lp: 520 });
        if (sub === 3 || sub === 7) musicBox(musGain, midi(CHORDS[bar][(bar + sub) % 4] + 24), t, 0.035, 0.9, sub === 3 ? -0.4 : 0.4);   // kalimba-glimt
        if (!night) {
          noise(musGain, t, 0.05, sub & 1 ? 0.035 : 0.055, { hp: 5500, pan: 0.25 });   // myk shaker
          if (sub === 0 || sub === 4) tone(musGain, 110, t, 0.2, 'sine', 0.22, { slide: 52 });   // rolig «hjerteslag»
        }
      }
    }
    function tick() {
      while (nextTime < ac.currentTime + 0.2) { schedule(step, nextTime); step++; nextTime += eighth; }
      Ambience.tick();
    }
    return {
      start() { if (playing || !ac) return; playing = true; step = 0; nextTime = ac.currentTime + 0.08; timer = setInterval(tick, 40); },
      stop() { playing = false; clearInterval(timer); timer = null; },
      setMode(m) {
        mode = m; if (!ac) return;
        musFilter.frequency.cancelScheduledValues(ac.currentTime);
        musFilter.frequency.setTargetAtTime(m === 'play' ? 7000 : 2400, ac.currentTime, 0.35);
      },
      slowmo(on) { if (ac) musFilter.frequency.setTargetAtTime(on ? 700 : (mode === 'play' ? 7000 : 2400), ac.currentTime, 0.25); },
      get playing() { return playing; }
    };
  })();

  /* ---------- Naturlyder ---------- */
  const Ambience = (() => {
    let windGain = null, nextBird = 0, nextCricket = 0, nextOwl = 0;
    const rnd = (a, b) => a + Math.random() * (b - a);
    function bird(t) {   // en liten kvitrefrase: 2–4 raske glidetoner, tilfeldig plassert i stereo
      const pan = rnd(-0.7, 0.7), n = 2 + ((Math.random() * 3) | 0), base = rnd(2600, 3600);
      for (let k = 0; k < n; k++) {
        const t0 = t + k * rnd(0.09, 0.14), f = base * rnd(0.9, 1.25);
        tone(ambGain, f, t0, rnd(0.06, 0.1), 'sine', 0.05, { attack: 0.01, slide: f * rnd(1.15, 1.5), pan });
      }
    }
    function cricket(t) {   // sirisser: korte pulser rundt 4,4 kHz
      const pan = rnd(-0.8, 0.8), f = rnd(4200, 4700);
      for (let k = 0; k < 4; k++) tone(ambGain, f, t + k * 0.04, 0.025, 'sine', 0.018, { attack: 0.004, pan });
    }
    function owl(t) {   // «hoo … hoo-hoo»
      const pan = rnd(-0.5, 0.5);
      [[0, 0.4], [0.62, 0.22], [0.9, 0.38]].forEach(([dt, d]) => tone(ambGain, 392, t + dt, d, 'sine', 0.06, { attack: 0.06, slide: 360, lp: 900, pan }));
    }
    return {
      start() {   // svak vind: støy gjennom båndpass, langsomt pulserende
        const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 0.6;
        windGain = ac.createGain(); windGain.gain.value = 0.05;
        const lfo = ac.createOscillator(), depth = ac.createGain(); lfo.frequency.value = 0.09; depth.gain.value = 0.035;
        lfo.connect(depth).connect(windGain.gain); lfo.start();
        s.connect(f).connect(windGain).connect(ambGain); s.start();
        const t = ac.currentTime; nextBird = t + 1.5; nextCricket = t + 1; nextOwl = t + rnd(8, 14);
        this.setNight(night);
      },
      setNight(on) { if (windGain) windGain.gain.setTargetAtTime(on ? 0.03 : 0.05, ac.currentTime, 1); },
      tick() {
        const t = ac.currentTime + 0.1;
        if (!night && t > nextBird) { bird(t); nextBird = t + rnd(3, 8); }
        if (night && t > nextCricket) { cricket(t); nextCricket = t + rnd(0.8, 2.2); }
        if (night && t > nextOwl) { owl(t); nextOwl = t + rnd(18, 32); }
      }
    };
  })();

  /* ---------- Lydeffekter ---------- */
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16];   // pentaton (F-dur): poengtonen stiger for hvert poeng på rad
  const now = () => ac.currentTime;
  return {
    unlock() { ensure(); if (!Music.playing) Music.start(); },
    // i bakgrunnen: stopp lydklokka helt (sekvenseren står da stille, ac.currentTime fryses)
    suspend() { if (ac && ac.state === 'running') ac.suspend(); },
    resume() { if (ac && ac.state === 'suspended') ac.resume(); },
    setNight(on) { night = on; if (ac) Ambience.setNight(on); },
    music: Music,
    flap() {   // mykt «fwip»: båndpass-støy som glir oppover + et lite pust
      if (!ac) return; const t = now();
      noise(sfxGain, t, 0.11, 0.22, { bp: 700, sweep: 2600, q: 1.2 });
      tone(sfxGain, 260, t, 0.09, 'sine', 0.08, { slide: 380 });
    },
    point(combo = 0) {   // bjelle/xylofon som stiger i skala
      if (!ac) return; const t = now(), n = 77 + SCALE[combo % SCALE.length];
      musicBox(sfxGain, midi(n), t, 0.2, 0.9);
      tone(sfxGain, midi(n) * 2.76, t, 0.12, 'sine', 0.035);
    },
    fanfare() {   // liten spilledåse-arpeggio (hvert 10. poeng og ny rekord)
      if (!ac) return; const t = now();
      [77, 81, 84, 89].forEach((n, i) => musicBox(sfxGain, midi(n), t + i * 0.09, 0.15, 1.2, (i - 1.5) * 0.2));
    },
    power() { if (!ac) return; const t = now(); [84, 88, 91, 96].forEach((n, i) => musicBox(sfxGain, midi(n), t + i * 0.06, 0.13, 0.8)); },
    shieldPop() {   // såpeboblen sier «plopp»
      if (!ac) return; const t = now();
      tone(sfxGain, 520, t, 0.12, 'sine', 0.3, { slide: 1250 });
      noise(sfxGain, t, 0.04, 0.12, { bp: 3000, q: 2 });
    },
    hit() {   // tegneserie-«bonk»: hult tre-dunk + en liten fjær-«boing»
      if (!ac) return; const t = now();
      tone(sfxGain, 420, t, 0.16, 'triangle', 0.32, { slide: 190, lp: 1600 });
      noise(sfxGain, t, 0.06, 0.18, { bp: 900, q: 3 });

const buzz = ms => { if ('vibrate' in navigator) try { navigator.vibrate(ms); } catch (e) {} };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Canvas ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = 1, scale = 1, W = LOGICAL_W, H = 560, safeTop = 0;

/* ---------- Tilstand ---------- */
const State = { MENU: 0, READY: 1, PLAY: 2, DEAD: 3, OVER: 4 };
let state = State.MENU;
let score = 0, time = 0, scoreT = -9;           // scoreT: tidspunkt for siste poeng (driver «sprett» på tallet)
let combo = 0, overShown = 0, overTitle = 'Å nei!', celebrated = false;
let press = { key: null, t: -9 };                // sist trykte knapp (klem-animasjon)
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);

let bird, pipes = [], particles = [], powers = [], floats = [], dust = [], stars = [], clouds = [];

let timeScale = 1, slowWas = false;
let paused = false, resumeT = 0;      // pause + nedtelling før spillet fortsetter

let deferredPrompt = null;
const hud = {};

/* ---------- Risting og fargetoning ----------
   Risting: dempet svingning langs en retning (bort fra treffet), ikke tilfeldig støy.
   Toning: myk farget vignett i stedet for hvit fullskjerm-blits. */
const fx = { amp: 0, t: 0, dx: 1, dy: 0, tint: 0, rgb: '255,120,100' };

}

// start i hvilehøyden, så fuglen aldri tegnes øverst i ett bilde før første fysikk-steg
function resetBird() {
  bird = {
    x: BIRD_X, y: (H - GROUND_H) * 0.42, vx: 0, vy: 0, rot: 0, angVel: 0, flapT: 9, sx: 1, sy: 1, sv: 0,
    blink: 0, blinkT: 1.5 + Math.random() * 2, happy: 0, look: 0, lookTo: 0, lookT: 1,   // ansikt
    crest: 0, crestV: 0, scarf: null, zT: 0.6                                            // sekundærbevegelse
  };
}
function resetRun() {
  resetBird(); pipes = []; particles = []; powers = []; floats = []; score = 0;
  active = { shield: false, slow: 0, double: 0 }; timeScale = 1; paused = false; resumeT = 0; grace = 0;
  combo = 0; overShown = 0; celebrated = false;
}
function goMenu() { state = State.MENU; resetRun(); transitionT = 1; Sound.music.setMode('menu'); }
function goReady() {
  state = State.READY; resetRun(); newBest = false; groundBounced = false;
  transitionT = 1; Sound.swoosh(); Sound.music.setMode('menu');
}
function goPlay() { state = State.PLAY; spawnPipe(W + 60); Sound.music.setMode('play'); }

function spawnPipe(x) {
  const groundY = H - GROUND_H;
  let gap = Math.max(D.gap * 0.72, D.gap - Math.min(score, 30) * 0.9);
  let variant = 'normal';
  if (score >= D.variantsFrom) { const r = Math.random(); if (r < 0.24) variant = 'moving'; else if (r < 0.44) variant = 'narrow'; }
  if (variant === 'narrow') gap *= 0.8;
  gap = Math.max(MIN_GAP, gap);
  const amp = variant === 'moving' ? 26 : 0;
  // fast sone rett over bakken: ekstra skjermhøyde blir bare himmel, så nivået er likt på alle telefoner
  const zoneBot = groundY - 40, zoneTop = Math.max(safeTop + 40, zoneBot - ZONE_H);
  const zLo = zoneTop + amp + gap / 2, zHi = zoneBot - amp - gap / 2;   // mulige gap-midtpunkt
  let lo = zLo, hi = zHi;
  const prev = pipes[pipes.length - 1];
  if (prev) {   // begrens hoppet fra forrige gap – gir flyt i stedet for urimelige sprang
    const pc = prev.baseTop + prev.gap / 2;
    lo = Math.max(zLo, pc - D.shift); hi = Math.min(zHi, pc + D.shift);
    if (lo > hi) lo = hi = clamp(pc, zLo, zHi);
  }
  if (lo > hi) lo = hi = (zLo + zHi) / 2;   // svært lav skjerm
  const top = lo + Math.random() * (hi - lo) - gap / 2;
  const seed = (Math.random() * 1e9) | 0;
  const p = { x, top, baseTop: top, gap, variant, amp, phase: Math.random() * Math.PI * 2, freq: 2.2 + Math.random() * 1.2, scored: false, glow: 0,
    seed, marksTop: barkMarks(seed), marksBot: barkMarks(seed + 1), decor: trunkDecorPlan(seed + 2) };
  pipes.push(p);
  if (score >= 3 && variant !== 'narrow' && Math.random() < 0.16 && !powers.some(q => q.x > W - 100)) {
    const keys = Object.keys(POWERS);
    const kind = active.shield ? (Math.random() < 0.5 ? 'slow' : 'double') : keys[(Math.random() * keys.length) | 0];
    powers.push({ x: x + PIPE_W / 2, y: p.top + p.gap / 2, pipe: p, kind, t: Math.random() * 10, taken: false });
  }
}

/* ---------- Partikler ---------- */
// shape: dot | puff (voksende røyk) | star | heart | feather (daler og svaier)
function burst(x, y, n, colors, spd, life, grav = 700, size = 3, { shape = 'dot', drag = 1.2, vdrag = 0, spin = 0 } = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life, max: life, grav, drag, vdrag, shape,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * spin, c: colors[(Math.random() * colors.length) | 0], r: size * (0.5 + Math.random()) });
  }
}
function floatText(x, y, txt, color, size = 13, { life = 0.85, vx = 0, vy = -42, stroke = false } = {}) {
  floats.push({ x, y, txt, color, size, life, max: life, vx, vy, stroke });
}
const feathers = (x, y, n) => burst(x, y, n, ['#7CC7F0', '#B4E2F8', '#FFF5E2'], 70, 1.3, 60, 2.2, { shape: 'feather', drag: 2.2, vdrag: 2.4, spin: 3 });

/* ---------- Pause ---------- */
function pauseGame() {
  if (state !== State.PLAY || paused) return;
  paused = true; resumeT = 0; Sound.music.setMode('menu');
}
function resumeGame() { if (paused && resumeT <= 0) { resumeT = 1.5; Sound.swoosh(); } }   // 3-2-1 før spillet fortsetter

/* ---------- Input ---------- */
function flap() {
  Sound.unlock();
  if (state === State.MENU) { goReady(); return; }
  if (state === State.READY) goPlay();
  if (state === State.PLAY) {
    if (paused) return;
    // fast impuls: hvert flaks gir nøyaktig samme løft, uansett hvor raskt man trykker
    bird.vy = D.flap;
    bird.flapT = 0; bird.sy = 1.22; bird.sx = 0.84;
    bird.angVel = -9;
    Sound.flap(); buzz(8);
    burst(bird.x - 10, bird.y + 8, 2, ['#FFFFFF'], 40, 0.45, -30, 3, { shape: 'puff', drag: 3 });
    if (Math.random() < 0.22) feathers(bird.x - 8, bird.y + 4, 1);
    return;
  }
  if (state === State.OVER && overT > 0.7) goReady();
}
function onPointer(e) {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale;
  for (const k in hud) {
    const b = hud[k];
    if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4) { press = { key: k, t: time }; Sound.unlock(); b.fn(); Sound.tick(); buzz(6); return; }
  }
  flap();
}
canvas.addEventListener('pointerdown', onPointer, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (paused) resumeGame(); else flap(); }
  else if (e.code === 'Escape' || e.code === 'KeyP') {
    if (state === State.PLAY) { if (paused) resumeGame(); else pauseGame(); }
    else if (e.code === 'Escape' && (state === State.READY || (state === State.OVER && overT > 0.7))) goMenu();
  }
});
// app i bakgrunnen / mister fokus: pause spillet og stopp lyden
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseGame(); Sound.suspend(); lastTime = 0; }
  else Sound.resume();
});
window.addEventListener('blur', pauseGame);

function setDiff(name) { diffName = name; D = DIFFS[name]; store.set('pf.diff', name); best = +store.get(bestKey()) || 0; }
function toggleTheme() {
  themeName = themeName === 'day' ? 'night' : 'day'; T = THEMES[themeName]; store.set('pf.theme', themeName);
  document.querySelector('meta[name=theme-color]').content = T.skyTop; document.documentElement.style.setProperty('--sky', T.skyTop);
  buildScene(); initAmbient(); Sound.setNight(T.night);
}

/* ---------- Kollisjon: sirkel mot avrundet rektangel ---------- */
function circleRRect(cx, cy, r, x, y, w, h, rad) {
  const ix = clamp(cx, x + rad, x + w - rad), iy = clamp(cy, y + rad, y + h - rad);
  const dx = cx - ix, dy = cy - iy;
  return dx * dx + dy * dy < (r + rad) * (r + rad);
}
function hitsPipe(p, groundY) {
  const r = BIRD_R - 1;
  const by = p.top + p.gap, lw = PIPE_W + TRUNK_LIP * 2;
  return circleRRect(bird.x, bird.y, r, p.x, -40, PIPE_W, p.top + 40 - END_H, 0)                            // øvre stamme
      || circleRRect(bird.x, bird.y, r, p.x - TRUNK_LIP, p.top - END_H, lw, END_H, END_H / 2)              // mosekant (kapsel)
      || circleRRect(bird.x, bird.y, r, p.x - TRUNK_LIP, by, lw, END_H, END_H / 2)
      || circleRRect(bird.x, bird.y, r, p.x, by + END_H, PIPE_W, groundY - by, 0);                         // nedre stamme
}

/* ---------- Fuglens liv: ansikt, fjærtopp og skjerf ---------- */
const KNOT = { x: -9, y: 5 };          // skjerfknuten (lokalt, bak på halsen)
function animateBird(dt) {
  // blunk hvert 2–5,5 s (blink går 1 → 0; lukkethet = sin(π·blink))
  if ((bird.blinkT -= dt) <= 0) { bird.blink = 1; bird.blinkT = 2 + Math.random() * 3.5; }
  bird.blink = Math.max(0, bird.blink - dt * 7);
  bird.happy = Math.max(0, bird.happy - dt);
  // ser seg rundt i hvile, ser framover i spill
  if (state === State.MENU || state === State.READY) {
    if ((bird.lookT -= dt) <= 0) { bird.lookTo = (Math.random() * 2 - 1) * 0.9; bird.lookT = 1 + Math.random() * 2.2; }
  } else bird.lookTo = 0.5;
  bird.look = lerp(bird.look, bird.lookTo, 1 - Math.exp(-8 * dt));
  // fjærtoppen henger etter bevegelsen (dempet fjær)
  const vy = state === State.PLAY || state === State.DEAD ? bird.vy : Math.cos(time * 3.2) * 20;
  bird.crestV += ((clamp(vy / 500, -1, 1) * 0.5 - bird.crest) * 160 - bird.crestV * 10) * dt; bird.crest += bird.crestV * dt;
  // søvnige «z» i menyen om natten
  if (state === State.MENU && T.night && (bird.zT -= dt) <= 0) {
    bird.zT = 1.1; floatText(bird.x + 9, bird.y - 14, 'z', '#FFF6E0', 9 + Math.random() * 4, { life: 1.6, vx: 9, vy: -16 });
  }
  scarfStep(dt);
}
function scarfAnchor(x, y, rot, sx, sy) {
  const kx = KNOT.x * sx, ky = KNOT.y * sy, c = Math.cos(rot), s = Math.sin(rot);
  return { x: x + kx * c - ky * s, y: y + kx * s + ky * c };
}
// skjerfsnippene: to korte kjeder (posisjonsbasert Verlet) som dras bakover av fartsvinden og flagrer litt
function scarfStep(dt) {
  if (!bird.scarf) bird.scarf = [4.4, 3.7].map(len => ({ len, pts: Array.from({ length: 4 }, (_, i) => ({ x: bird.x - 9 - i * len, y: bird.y + 5, ox: bird.x - 9 - i * len, oy: bird.y + 5 })) }));
  const a = scarfAnchor(bird.x, bird.y, bird.rot, bird.sx, bird.sy);
  const airX = state === State.DEAD || state === State.OVER ? 0 : -D.speed * timeScale;
  bird.scarf.forEach((tail, ti) => {
    let prev = a;
    tail.pts.forEach((pt, i) => {
      const vx = (pt.x - pt.ox) / dt, vy = (pt.y - pt.oy) / dt;
      const ax = (airX - vx) * 6, ay = 300 - vy * 1.5 + Math.sin(time * 17 + i * 1.3 + ti * 2) * 90;
      pt.ox = pt.x; pt.oy = pt.y;
      pt.x += vx * dt + ax * dt * dt; pt.y += vy * dt + ay * dt * dt;
      const dx = pt.x - prev.x, dy = pt.y - prev.y, d = Math.hypot(dx, dy) || 1;
      pt.x = prev.x + dx / d * tail.len; pt.y = prev.y + dy / d * tail.len;
      prev = pt;
    });

}

/* ---------- Stammenes utseende (frøbasert, så hver stamme er unik men stabil) ---------- */
const rng = seed => () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
function barkMarks(seed) {
  const r = rng(seed), out = [];
  for (let d = 8 + r() * 10; d < 900; d += 10 + r() * 16) out.push({ d, x: 4 + r() * (PIPE_W - 22), len: 5 + r() * 11, th: 1.2 + r() * 1.5, scar: r() < 0.08 });
  return out;
}
function trunkDecorPlan(seed) {
  const r = rng(seed), side = () => (r() < 0.5 ? -1 : 1);
  return {
    fungus: r() < 0.45 ? side() : 0, fungusD: 26 + r() * 50,          // kjuker på nedre stamme
    sprigBot: r() < 0.45 ? side() : 0, sprigBotD: 60 + r() * 70,      // kvister med blader
    sprigTop: r() < 0.5 ? side() : 0, sprigTopD: 30 + r() * 70,
    owl: r() < 0.14, owlD: 52 + r() * 40,                             // ugle i et hull i øvre stamme
    toad: r() < 0.5 ? side() : 0,                                     // fluesopp ved roten
    moss: (r() * 1e6) | 0
  };
}
// stemningsprikker: pollen om dagen (hele himmelen), ildfluer om natten (nær bakken)
const moteY = groundY => T.night ? groundY - 25 - Math.random() * 145 : Math.random() * (groundY - 40);

/* ---------- Oppdatering (dt i sekunder) ---------- */
// lagre tilstanden før steget, så render() kan interpolere mellom forrige og nåværende steg
function snapshot() {
  prevScroll = scroll;
  bird.px = bird.x; bird.py = bird.y; bird.pr = bird.rot;
  for (const p of pipes) { p.px = p.x; p.ptop = p.top; }
  for (const q of powers) { q.px = q.x; q.py = q.y; }
  for (const q of particles) { q.px = q.x; q.py = q.y; }
  for (const m of dust) { m.px = m.x; m.py = m.y; }
}

function update(dt) {
  snapshot();
  time += dt;
  if (paused) {
    if (resumeT > 0 && (resumeT -= dt) <= 0) { resumeT = 0; paused = false; Sound.music.setMode('play'); if (active.slow > 0) Sound.music.slowmo(true); }
    return;
  }
  const wantSlow = state === State.PLAY && active.slow > 0;
  timeScale = lerp(timeScale, wantSlow ? 0.55 : 1, 1 - Math.pow(0.001, dt));
  if (wantSlow !== slowWas) { Sound.music.slowmo(wantSlow); slowWas = wantSlow; }
  const gdt = dt * timeScale;      // spilltid
  const scrolling = state !== State.DEAD && state !== State.OVER;
  if (scrolling) scroll += D.speed * gdt;

  transitionT = Math.max(0, transitionT - dt * 2.4);
  fx.t += dt; fx.tint = Math.max(0, fx.tint - dt * 2.2);
  animateBird(dt);

  const groundY = H - GROUND_H, idleY = groundY * 0.42;

  if (state === State.MENU || state === State.READY) {
    bird.y = idleY + Math.sin(time * 3.2) * 6; bird.rot = Math.sin(time * 3.2 + 1) * 0.08; bird.flapT += dt;
    bird.sx = lerp(bird.sx, 1, dt * 10); bird.sy = lerp(bird.sy, 1, dt * 10);
  }

  if (state === State.PLAY) {
    // tyngdekraft + luftmotstand + terminalfart
    bird.vy += D.gravity * gdt;
    bird.vy -= bird.vy * AIR_DRAG * gdt;
    bird.vy = clamp(bird.vy, -900, TERMINAL);
    bird.y += bird.vy * gdt;
    bird.flapT += gdt;
    // etter skjoldtreff: gli mykt inn mot midten av gapet i stedet for å hoppe dit
    if (grace > 0) {
      grace = Math.max(0, grace - gdt);
      if (grace > SHIELD_GRACE - 0.4) {
        const k = 1 - Math.exp(-8 * gdt), gy = guideY();
        bird.y = lerp(bird.y, gy, k); bird.vy = lerp(bird.vy, -40, k);
      }
    }
    // rotasjon som fjær mot målvinkel
    const target = bird.vy < 0 ? -0.45 : clamp((bird.vy - 60) / 380, 0, 1) * 1.4;
    const k = bird.vy < 0 ? 140 : 40, damp = bird.vy < 0 ? 16 : 10;
    bird.angVel += ((target - bird.rot) * k - bird.angVel * damp) * gdt;
    bird.rot += bird.angVel * gdt;
    // squash & stretch – fjærer tilbake til 1, strekkes litt ved fall
    const fallStretch = clamp(bird.vy / TERMINAL, 0, 1) * 0.1;
    bird.sx = lerp(bird.sx, 1 - fallStretch * 0.5, 1 - Math.pow(0.0005, gdt));
    bird.sy = lerp(bird.sy, 1 + fallStretch, 1 - Math.pow(0.0005, gdt));
    if (bird.y < safeTop + 6) { bird.y = safeTop + 6; bird.vy = Math.max(bird.vy, 0); }
    for (const p of pipes) {
      p.x -= D.speed * gdt;
      if (p.variant === 'moving') { p.phase += p.freq * gdt; p.top = p.baseTop + Math.sin(p.phase) * p.amp; }
      p.glow = Math.max(0, p.glow - dt * 2.5);
    }
    const last = pipes[pipes.length - 1];
    if (last && last.x < W - D.spacing) spawnPipe(last.x + D.spacing);
    if (pipes.length && pipes[0].x < -PIPE_W - 20) pipes.shift();

    active.slow = Math.max(0, active.slow - dt); active.double = Math.max(0, active.double - dt);

    for (const q of powers) {
      q.x -= D.speed * gdt; q.t += dt;
      q.y = q.pipe.top + q.pipe.gap / 2 + Math.sin(q.t * 4) * 4;
      if (!q.taken && Math.hypot(q.x - bird.x, q.y - bird.y) < POWER_R + BIRD_R - 2) collect(q);
    }
    powers = powers.filter(q => !q.taken && q.x > -40);

    for (const p of pipes) {
      if (!p.scored && p.x + PIPE_W / 2 < bird.x) {
        p.scored = true; p.glow = 1; scoreT = time;
        const gain = active.double > 0 ? 2 : 1, before = score; score += gain;
        Sound.point(combo++); buzz(12); bird.happy = 0.45;
        if (Math.floor(score / 10) > Math.floor(before / 10)) {   // milepæl hvert 10. poeng: liten fanfare
          Sound.fanfare(); floatText(bird.x + 12, bird.y - 34, `${Math.floor(score / 10) * 10}!`, '#FFD27A', 18, { stroke: true, life: 1.1, vy: -30 });
          burst(bird.x + 10, bird.y - 10, 10, ['#FFD45C', '#FFF1C4', '#FF9EB5'], 140, 0.8, 120, 2.6, { shape: 'star', spin: 6 });
        }
        burst(bird.x + 14, bird.y - 4, 5, ['#FFD45C', '#FFF1C4'], 80, 0.55, 120, 2.4, { shape: 'star', spin: 6 });
        burst(bird.x + 10, bird.y - 8, 2, ['#FF9EB5'], 60, 0.6, 60, 2.2, { shape: 'heart' });
        if (gain === 2) floatText(bird.x + 4, bird.y - 22, '+2', '#FFD27A', 14, { stroke: true });
        if (score > best) { best = score; newBest = true; store.set(bestKey(), best); }
      }
      if (grace <= 0 && p.x < bird.x + BIRD_R + 6 && p.x + PIPE_W > bird.x - BIRD_R - 6 && hitsPipe(p, groundY)) {
        if (active.shield) useShield(p); else { die(false, p); break; }
      }
    }
    if (state === State.PLAY && bird.y + BIRD_R >= groundY) { bird.y = groundY - BIRD_R; die(true); }
  }

  if (state === State.DEAD) {
    // rekyl fra røret, tumling, sprett i bakken
    bird.vy += D.gravity * 1.15 * dt; bird.vy = Math.min(bird.vy, TERMINAL + 150);
    bird.vx -= bird.vx * 2.2 * dt;
    bird.x += bird.vx * dt; bird.y += bird.vy * dt;
    bird.angVel -= bird.angVel * 1.5 * dt; bird.rot += bird.angVel * dt;
    bird.sx = lerp(bird.sx, 1, dt * 6); bird.sy = lerp(bird.sy, 1, dt * 6);
    if (bird.y + BIRD_R >= groundY) {
      bird.y = groundY - BIRD_R;
      burst(bird.x, groundY - 2, 6, [T.soil, '#FFFFFF'], 60, 0.6, -20, 4, { shape: 'puff', drag: 3 });
      Sound.thud(); buzz(30);
      if (!groundBounced && bird.vy > 220) { groundBounced = true; bird.vy = -bird.vy * 0.32; bird.angVel = -bird.rot * 5; bird.sy = 0.7; bird.sx = 1.3; addShake(3, 0, 1); }
      else { land(); Sound.swoosh(); Sound.sting(); }
    }
  }
  if (state === State.OVER) {
    overT = Math.min(3, overT + dt);
    // poengene telles opp med små klikk; ny rekord feires med blomsterkonfetti når tallet er framme
    const shown = Math.min(score, Math.floor(Math.max(0, overT - 0.55) * 30));
    if (shown !== overShown) { overShown = shown; Sound.count(); }
    if (newBest && !celebrated && overShown === score) { celebrated = true; Sound.fanfare(); confetti(); }
    // fuglen setter seg: rotasjon og «gelé»-klem fjærer tilbake, og den sitter på føttene
    bird.angVel += (-bird.rot * 90 - bird.angVel * 10) * dt; bird.rot += bird.angVel * dt;
    bird.sv += ((1 - bird.sy) * 220 - bird.sv * 9) * dt; bird.sy += bird.sv * dt; bird.sx = 2 - bird.sy;
    bird.y = lerp(bird.y, groundY - 15, 1 - Math.exp(-12 * dt));
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.grav * dt; q.vx -= q.vx * q.drag * dt; q.life -= dt;
    if (q.vdrag) q.vy -= q.vy * q.vdrag * dt;
    q.rot += q.vr * dt;
    if (q.life <= 0) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; if (f.life <= 0) floats.splice(i, 1); }
  for (const m of dust) {
    m.x -= (D.speed * 0.2 * (scrolling ? 1 : 0) + m.vx) * dt; m.y += Math.sin(time * m.f + m.p) * 6 * dt;
    if (m.x < -10) { m.x = m.px = W + 10; m.y = m.py = moteY(groundY); }   // ingen interpolering over skjermen ved omstart
  }
}

function collect(q) {
  q.taken = true; const P = POWERS[q.kind];
  if (q.kind === 'shield') active.shield = true; else active[q.kind] = P.dur;
  Sound.power(); buzz([10, 20, 10]); bird.happy = 0.6;
  burst(q.x, q.y, 10, [P.color, '#FFFFFF'], 120, 0.6, 150, 2.6, { shape: 'star', spin: 6 });
  floatText(bird.x + 4, bird.y - 26, P.label, P.color, 13, { stroke: true });
}
const guideY = () => guidePipe ? guidePipe.top + guidePipe.gap / 2 : bird.y;
function useShield(p) {
  active.shield = false; Sound.shieldPop(); buzz([20, 10, 30]);
  addShake(3, -1, 0); addTint(0.8, '63,169,245');
  burst(bird.x, bird.y, 14, ['#BFEAFB', '#FFFFFF', '#FFC6DD'], 150, 0.5, 120, 2.6);   // boblen spretter
  floatText(bird.x + 4, bird.y - 24, 'Plopp!', '#BFEAFB', 14, { stroke: true });
  // ingen teleport: kort usårbarhet, og fuglen glir inn i gapet (se update)
  grace = SHIELD_GRACE; guidePipe = p; p.scored = true;
}
function die(onGround, p) {
  Sound.hit(); if (!onGround) Sound.die();
  buzz([40, 20, 60]); addTint(1, '255,110,90');
  active = { shield: false, slow: 0, double: 0 }; grace = 0;
  overTitle = newBest ? 'Ny rekord!' : ['Å nei!', 'Oi da!', 'Uff da!'][(Math.random() * 3) | 0];
  burst(bird.x + 6, bird.y - 6, 6, ['#FFD45C', '#FFF1C4'], 110, 0.6, 200, 2.6, { shape: 'star', spin: 8 });
  feathers(bird.x, bird.y, 3);
  if (onGround) {
    floatText(bird.x + 6, bird.y - 22, 'Plopp!', '#FFD27A', 16, { stroke: true, life: 1 });
    burst(bird.x, bird.y + 8, 6, [T.soil, '#FFFFFF'], 60, 0.6, -20, 4, { shape: 'puff', drag: 3 });
    land(); addShake(4, 0, 1); Sound.sting();
  } else {
    state = State.DEAD;
    // «Bonk!»: klemmes flatt mot stammen (sidetreff) eller mot snittflaten (ovenfra/nedenfra), så rekyl og en rolig vipp bakover
    const side = !p || bird.x + BIRD_R - 3 < p.x;
    const fromRight = p ? bird.x < p.x + PIPE_W / 2 : true;
    floatText(bird.x + 8, bird.y - 22, 'Bonk!', '#FF9E85', 17, { stroke: true, life: 1 });
    bird.vx = fromRight ? -120 : 80; bird.vy = Math.min(bird.vy, 0) * 0.3 - 150;
    bird.angVel = fromRight ? -4 : 4;
    if (side) { bird.sx = 0.62; bird.sy = 1.3; } else { bird.sx = 1.3; bird.sy = 0.66; }
    addShake(5, fromRight ? -1 : 1, -0.3);
  }
}
// blomsterblader som daler ned over hele skjermen
function confetti() {
  const cols = ['#FFC6D6', '#FFFFFF', '#FFE27A', '#D9C6F7', '#FF9EB5'];
  for (let i = 0; i < 30; i++) {
    const life = 2.6 + Math.random() * 1.2;
    particles.push({ x: Math.random() * W, y: safeTop - 10 - Math.random() * 60, vx: (Math.random() - 0.5) * 40, vy: 30 + Math.random() * 40,
      grav: 25, drag: 0.6, vdrag: 0.9, shape: 'petal', rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 4,
      c: cols[(Math.random() * cols.length) | 0], r: 2.2 + Math.random() * 1.4, life, max: life });
  }
}
// landing etter krasj: fuglen blir sittende oppreist og svimmel (ikke opp-ned)
function land() {
  state = State.OVER; overT = 0;
  bird.vy = 0; bird.vx = 0; bird.sy = 0.7; bird.sx = 1.3; bird.sv = 0;
}

/* ============================================================
   TEGNING
   Stil: varm pastell, myke former og varme konturer.
   Statiske bakgrunnslag tegnes én gang (buildScene) til offscreen-lerreter
   og blittes hvert bilde; bare det som beveger seg tegnes live.
   ============================================================ */
const UI_INK = '#5B4636';               // kontur og tekst i brukergrensesnittet (lik i begge tema)
const BODY_R = 12.5;                    // fuglens tegnede kropp (treffsirkelen er litt mindre = tilgivende)
const BIRD = {
  body: '#7CC7F0', light: '#B4E2F8', dark: '#4FA6DB', belly: '#FFF5E2', ink: '#2E4467',
  beak: '#FFAE57', beakDark: '#E8842E', cheek: 'rgba(255,128,150,.55)', scarf: '#E5574A', scarfDark: '#B93E34'
};

const wrap = (v, m) => ((v % m) + m) % m;
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function rr(x, y, w, h, r, g = ctx) {
  const rad = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath();
}
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
// union av sirkler med ren ytterkontur: konturen tegnes som litt større sirkler under fyllet
function blob(g, pts, fill, ink, lw = 1.2, inkAlpha = 1) {
  if (ink) { g.globalAlpha = inkAlpha; g.fillStyle = ink; for (const [x, y, r] of pts) circle(g, x, y, r + lw); g.globalAlpha = 1; }
  g.fillStyle = fill; for (const [x, y, r] of pts) circle(g, x, y, r);
}
function starPath(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const k = i % 2 ? r * 0.45 : r, a = rot - Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k); }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); ctx.closePath();
}
function text(txt, x, y, size, opts = {}) {
  const { weight = 700, align = 'center', color = T.text, shadow = true, alpha = 1, baseline = 'middle', stroke = false } = opts;
  ctx.font = `${weight} ${size}px Fredoka, system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = baseline; ctx.globalAlpha = alpha;
  if (shadow) { ctx.fillStyle = T.textShadow; ctx.fillText(txt, x, y + Math.max(1.5, size * 0.08)); }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.2, size * 0.15); ctx.strokeStyle = UI_INK; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = color; ctx.fillText(txt, x, y); ctx.globalAlpha = 1;
}

/* ---------- Offscreen-lag ---------- */
let scene = null;
// flislag: bredden rundes til hele skjermpiksler, så flisene møtes uten søm
function makeLayer(wWanted, h, draw) {
  const R = dpr * scale, cw = Math.max(1, Math.round(wWanted * R)), ch = Math.max(1, Math.ceil(h * R));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d'); g.setTransform(R, 0, 0, R, 0, 0); g.lineJoin = 'round'; g.lineCap = 'round';
  const L = { c, w: cw / R, h: ch / R };
  draw(g, L.w, L.h, L);
  return L;
}
const makeSprite = (w, h, draw) => makeLayer(w, h, draw);
// fyll fra en sømløs kamlinje y = top(x) ned til bunnen av laget
function ridgePath(g, w, h, top, step = 2) {
  g.beginPath(); g.moveTo(0, h);
  for (let x = 0; x <= w + 0.01; x += step) g.lineTo(x, top(x));
  g.lineTo(w, top(w)); g.lineTo(w, h); g.closePath();
}
function strokeRidge(g, w, top, color, lw, step = 2) {
  g.beginPath(); g.moveTo(0, top(0));
  for (let x = step; x <= w + 0.01; x += step) g.lineTo(x, top(x));
  g.strokeStyle = color; g.lineWidth = lw; g.stroke();
}
// myke «klokker» som gjentar seg med periode w (max = tydelige topper, sum = bølgende åser)
function bumps(w, list, mode) {
  return x => {
    let y = 0;
    for (const b of list) { const d = wrap(x - b.x + w / 2, w) - w / 2, v = b.h * Math.exp(-(d * d) / (b.s * b.s)); y = mode === 'max' ? Math.max(y, v) : y + v; }
    return y;
  };
}
// tegn et objekt to ganger hvis det krysser flisens kant
const tiled = (w, x, pad, fn) => { fn(x); if (x < pad) fn(x + w); if (x > w - pad) fn(x - w); };

function buildScene() {
  scene = {};
  const TAU = Math.PI * 2;

  // 1) fjell, snø, dis og fjord (topp = groundY - 230)
  scene.mountains = makeLayer(420, 230, (g, w, h) => {
    const r = rng(11), base = h - 70;
    const far = bumps(w, Array.from({ length: 5 }, (_, i) => ({ x: (i + 0.2 + r() * 0.6) * w / 5, h: 96 + r() * 56, s: 46 + r() * 18 })), 'max');
    const near = bumps(w, Array.from({ length: 6 }, (_, i) => ({ x: (i + r()) * w / 6, h: 48 + r() * 30, s: 36 + r() * 14 })), 'max');
    const farTop = x => base - far(x);
    ridgePath(g, w, h, farTop); g.fillStyle = T.mountainFar; g.fill();
    g.save(); g.clip();   // snø: alt over en bølgete snølinje, klippet mot fjellet
    g.fillStyle = T.snow; g.beginPath(); g.moveTo(0, -5);
    for (let x = 0; x <= w + 0.01; x += 3) g.lineTo(x, base - 112 + Math.sin(x / w * TAU * 9) * 3 + Math.sin(x / w * TAU * 4) * 4);
    g.lineTo(w, -5); g.closePath(); g.fill(); g.restore();
    strokeRidge(g, w, farTop, hexA(T.ink, 0.18), 1.2);
    const nearTop = x => base + 10 - near(x);
    ridgePath(g, w, h, nearTop); g.fillStyle = T.mountainNear; g.fill();
    strokeRidge(g, w, nearTop, hexA(T.ink, 0.22), 1.2);
    const hz = g.createLinearGradient(0, base - 50, 0, base + 4);   // atmosfærisk dis mot foten
    hz.addColorStop(0, hexA(T.skyBot, 0)); hz.addColorStop(1, hexA(T.skyBot, 0.6));
    g.fillStyle = hz; g.fillRect(0, base - 50, w, 54);
    g.fillStyle = T.fjord; g.fillRect(0, base + 2, w, h - base - 2);
    g.fillStyle = hexA(T.fjordLight, 0.9); g.fillRect(0, base + 2, w, 1.5);
    g.fillStyle = hexA(T.fjordLight, 0.7);
    for (let i = 0; i < 22; i++) { const x = r() * w, y = base + 7 + r() * (h - base - 12), l = 4 + r() * 8; tiled(w, x, l, xx => g.fillRect(xx, y, l, 1.1)); }
  });

  // 2) åser med røde hytter og torvtak (topp = groundY - 96); pipene huskes for røyken
  scene.hills = makeLayer(360, 96, (g, w, h, L) => {
    const r = rng(23), base = h - 46;
    const list = Array.from({ length: 4 }, (_, i) => ({ x: (i + 0.3 + r() * 0.4) * w / 4, h: 16 + r() * 16, s: 32 + r() * 12 }));
    const f = bumps(w, list, 'sum'), top = x => base - f(x);
    ridgePath(g, w, h, top); g.fillStyle = T.hillFar; g.fill();
    strokeRidge(g, w, top, hexA(T.ink, 0.25), 1.2);
    L.chimneys = [];
    for (const i of [0, 2]) cabin(g, list[i].x, top(list[i].x) + 1.5, L);
    for (const i of [1, 3]) for (const dx of [-9, 0, 8]) {   // små runde trær
      const x = list[i].x + dx + r() * 4, y = top(x) + 1, s = 0.75 + r() * 0.35;
      g.fillStyle = T.roof; g.fillRect(x - 0.7, y - 6 * s, 1.4, 6 * s);
      blob(g, [[x, y - 9 * s, 5 * s], [x - 3 * s, y - 6.5 * s, 3.6 * s], [x + 3 * s, y - 6.5 * s, 3.6 * s]], T.forest, hexA(T.ink, 0.5), 0.9);
    }
  });

  // 3) bjørkeskog med skogbunn (topp = groundY - 84)
  scene.forest = makeLayer(300, 84, (g, w, h) => {
    const r = rng(37);
    const floor = x => h - 30 - (Math.sin(x / w * TAU * 3) * 4 + Math.sin(x / w * TAU * 5 + 1) * 3);
    const trees = Array.from({ length: 17 }, () => ({ x: r() * w, s: 0.7 + r() * 0.45, warm: r() < 0.18, back: r() < 0.5 }));
    trees.sort((a, b) => (a.back !== b.back ? (a.back ? -1 : 1) : a.s - b.s));
    for (const t of trees) tiled(w, t.x, 16, x => birchTree(g, x, floor(t.x) + (t.back ? -4 : 3), t.s, t.warm, t.back));
    ridgePath(g, w, h, floor); g.fillStyle = T.hillNear; g.fill();
    strokeRidge(g, w, floor, hexA(T.ink, 0.28), 1.2);
  });

  // 4) busker og blomster (topp = groundY - 40)
  scene.bushes = makeLayer(240, 40, (g, w, h) => {
    const r = rng(53);
    for (let i = 0; i < 5; i++) { const x = (i + 0.2 + r() * 0.6) * w / 5, s = 0.75 + r() * 0.5; tiled(w, x, 22, xx => bush(g, xx, h + 2, s)); }
    const petals = ['#FFFFFF', '#FFC6D6', '#FFE27A', '#D9C6F7'];
    for (let i = 0; i < 16; i++) { const x = r() * w, y = h - 3 - r() * 7, c = petals[(r() * 4) | 0]; tiled(w, x, 4, xx => flower(g, xx, y, 1.5, c)); }
  });

  // 5) bakken: gress med kamskjell-kant, tuster og blomster, jord med steiner (topp = groundY - 10)
  scene.ground = makeLayer(144, GROUND_H + 10, (g, w, h) => {
    const r = rng(71), top = 10;
    const sg = g.createLinearGradient(0, top, 0, h); sg.addColorStop(0, T.soil); sg.addColorStop(1, T.soilDark);
    g.fillStyle = sg; g.fillRect(0, top + 6, w, h - top - 6);
    g.fillStyle = hexA(T.soilDark, 0.6);   // et mørkere jordlag
    g.beginPath(); g.moveTo(0, top + 44);
    for (let x = 0; x <= w + 0.01; x += 3) g.lineTo(x, top + 44 + Math.sin(x / w * TAU * 2) * 3);
    for (let x = w; x >= -0.01; x -= 3) g.lineTo(x, top + 52 + Math.sin(x / w * TAU * 3 + 1) * 2.5);
    g.closePath(); g.fill();
    for (let i = 0; i < 10; i++) {   // småstein
      const x = r() * w, y = top + 24 + r() * (h - top - 32), rx = 2.5 + r() * 3.5, ry = 1.8 + r() * 1.8;
      tiled(w, x, rx + 2, xx => {
        g.fillStyle = hexA(T.ink, 0.3); g.beginPath(); g.ellipse(xx, y, rx + 0.9, ry + 0.9, 0, 0, TAU); g.fill();
        g.fillStyle = T.stone; g.beginPath(); g.ellipse(xx, y, rx, ry, 0, 0, TAU); g.fill();
        g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(xx - rx * 0.3, y - ry * 0.35, rx * 0.4, ry * 0.3, 0, 0, TAU); g.fill();
      });
    }
    g.fillStyle = hexA(T.soilDark, 0.8);
    for (let i = 0; i < 26; i++) { const x = r() * w, y = top + 18 + r() * (h - top - 22); tiled(w, x, 1, xx => circle(g, xx, y, 0.7 + r() * 0.5)); }
    // gresskant: mørk underkant, så lys kamskjell-kant
    g.fillStyle = hexA(T.ink, 0.18); g.fillRect(0, top + 10, w, 3);
    g.fillStyle = T.grassDark; g.fillRect(0, top, w, 10); for (let x = 0; x < w; x += 12) circle(g, x + 6, top + 10, 6);
    g.fillStyle = T.grass; g.fillRect(0, top, w, 6); for (let x = 0; x < w; x += 12) circle(g, x + 6, top + 6, 5.5);
    for (let i = 0; i < 18; i++) {   // gresstuster over kanten
      const x = (i + r() * 0.8) * w / 18, hh = 5 + r() * 4;
      tiled(w, x, 4, xx => {
        g.strokeStyle = i % 3 ? T.grass : T.grassDark; g.lineWidth = 1.6;
        g.beginPath(); g.moveTo(xx - 2, top + 3); g.quadraticCurveTo(xx - 2.5, top - hh * 0.5, xx - 3.5, top + 2 - hh);
        g.moveTo(xx, top + 3); g.quadraticCurveTo(xx + 0.5, top - hh * 0.6, xx + 0.5, top + 1 - hh * 1.1);
        g.moveTo(xx + 2, top + 3); g.quadraticCurveTo(xx + 2.5, top - hh * 0.4, xx + 4, top + 3 - hh * 0.8); g.stroke();
      });
    }
    for (let i = 0; i < 5; i++) { const x = r() * w, c = ['#FFFFFF', '#FFE27A', '#FFC6D6'][i % 3]; tiled(w, x, 4, xx => flower(g, xx, top - 1 - r() * 2, 1.7, c)); }
  });

  // himmel med solglød, og vignett: tegnes én gang i full skjermstørrelse (ugjennomsiktig blit er billigere enn gradienter hvert bilde)
  const groundY = H - GROUND_H, sx = W - 64, sy = safeTop + 104;
  scene.sky = makeSprite(W, groundY, g => {
    const gr = g.createLinearGradient(0, 0, 0, groundY);
    gr.addColorStop(0, T.skyTop); gr.addColorStop(0.55, T.skyMid); gr.addColorStop(1, T.skyBot);
    g.fillStyle = gr; g.fillRect(0, 0, W + 2, groundY + 2);
    const sg = g.createRadialGradient(sx, sy, 8, sx, sy, 78);
    sg.addColorStop(0, T.sunGlow); sg.addColorStop(1, hexA(T.skyMid, 0));
    g.fillStyle = sg; g.fillRect(sx - 80, sy - 80, 160, 160);
  });
  scene.vignette = makeSprite(W, H, g => {
    const vg = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8);
    vg.addColorStop(0, hexA('#000000', 0)); vg.addColorStop(1, T.vignette);
    g.fillStyle = vg; g.fillRect(0, 0, W + 2, H + 2);
  });
  // sprites: tre skyformer, luftballong og glød (ildfluer/vinduer)

function cabin(g, x, y, L) {
  const w = 18, h = 11;
  g.save(); g.translate(x, y); g.lineWidth = 1.1; g.strokeStyle = T.ink;
  g.fillStyle = T.cabinDark; g.fillRect(3.5, -h - 12, 3.6, 8); g.strokeRect(3.5, -h - 12, 3.6, 8);   // pipe
  g.fillStyle = T.cabin; g.fillRect(-w / 2, -h, w, h);
  g.fillStyle = T.cabinDark; for (let i = -w / 2 + 3; i < w / 2; i += 3) g.fillRect(i, -h + 1, 0.6, h - 1);   // panel
  g.strokeRect(-w / 2, -h, w, h);
  g.fillStyle = T.roof; g.beginPath(); g.moveTo(-w / 2 - 3, -h + 0.5); g.lineTo(0, -h - 8); g.lineTo(w / 2 + 3, -h + 0.5); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = T.moss; g.lineWidth = 2.6;   // torvtak
  g.beginPath(); g.moveTo(-w / 2 - 2, -h - 0.6); g.lineTo(0, -h - 8.6); g.lineTo(w / 2 + 2, -h - 0.6); g.stroke();
  g.fillStyle = T.roof; g.fillRect(-6.5, -7, 3.6, 7);   // dør

    const gl = g.createRadialGradient(3.5, -6, 0, 3.5, -6, 13);

  g.strokeStyle = T.cabinDark; g.lineWidth = 0.7; g.strokeRect(1, -8, 5.2, 4.4);
  g.beginPath(); g.moveTo(3.6, -8); g.lineTo(3.6, -3.6); g.stroke();

}
function birchTree(g, x, y, s, warm, back) {

function bush(g, x, y, s) {

function flower(g, x, y, r, c) {

/* ---------- Stemningselementer (live) ---------- */
function initAmbient() {
  const groundY = H - GROUND_H, r = rng(91);
  stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * (groundY - 200), r: Math.random() < 0.3 ? 1.6 : 1, p: Math.random() * 10 }));
  dust = Array.from({ length: T.night ? 14 : 18 }, () => ({ x: Math.random() * W, y: moteY(groundY), r: 0.8 + Math.random() * 1.2, vx: 4 + Math.random() * 10, f: 0.5 + Math.random(), p: Math.random() * 6 }));
  const span = Math.max(60, groundY - 310 - safeTop);
  clouds = Array.from({ length: 6 }, (_, i) => ({ x: r() * (W + 160), y: safeTop + 34 + r() * span, s: i < 3 ? 0.55 + r() * 0.2 : 0.85 + r() * 0.3, sp: i < 3 ? 0.03 : 0.07, drift: 2 + r() * 3, v: i % 3, far: i < 3 }));
}
// tegn et flislag med scroll; snapper til skjermpiksler så flisene aldri får søm
function drawLayer(L, y, speed, each) {
  const R = dpr * scale;
  let x = Math.round(-wrap(viewScroll * speed, L.w) * R) / R;
  for (; x < W; x += L.w) { ctx.drawImage(L.c, x, y, L.w, L.h); if (each) each(x); }
}
function drawSky(groundY) {
  ctx.drawImage(scene.sky.c, 0, 0, scene.sky.w, scene.sky.h);
  if (T.night) {
    ctx.fillStyle = '#FFF3D6';
    for (const s of stars) { ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * 2 + s.p)); circle(ctx, s.x, s.y, s.r); }
    ctx.globalAlpha = 1;
    const ph = (time % 13) / 13;   // stjerneskudd av og til
    if (ph < 0.06 && !reduceMotion) {
      const k = ph / 0.06, x = W * 0.78 - k * 130, y = safeTop + 50 + k * 46, a = Math.sin(k * Math.PI);
      const sg = ctx.createLinearGradient(x, y, x + 30, y - 11); sg.addColorStop(0, `rgba(255,246,220,${a})`); sg.addColorStop(1, 'rgba(255,246,220,0)');
      ctx.strokeStyle = sg; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 30, y - 11); ctx.stroke();
    }
  }
  // myk sol / søvnig halvmåne (ingen harde lysstråler); gløden ligger ferdig i himmelbildet
  const sx = W - 64, sy = safeTop + 104;
  ctx.fillStyle = T.sun;
  if (T.night) {
    ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, 19, 0, 7); ctx.clip();
    ctx.beginPath(); ctx.rect(sx - 21, sy - 21, 42, 42); ctx.arc(sx + 8, sy - 5, 16, 0, 7); ctx.fill('evenodd');
    ctx.restore();
    ctx.strokeStyle = hexA(T.ink, 0.8); ctx.lineWidth = 1.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(sx - 9, sy + 1, 2.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();   // lukket øye
    ctx.fillStyle = 'rgba(255,150,170,.5)'; ctx.beginPath(); ctx.ellipse(sx - 11.5, sy + 6, 2.4, 1.4, 0, 0, 7); ctx.fill();
  } else {
    circle(ctx, sx, sy, 20);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; circle(ctx, sx - 6, sy - 6, 6);
  }
  // skyer (to lag) og luftballong
  for (const c of clouds) {
    const x = wrap(c.x - viewScroll * c.sp - time * c.drift, W + 160) - 80, S = scene.clouds[c.v];
    ctx.globalAlpha = c.far ? 0.8 : 1; ctx.drawImage(S.c, x, c.y, S.w * c.s, S.h * c.s);
  }
  ctx.globalAlpha = 1;
  if (groundY - safeTop > 400) {
    const B = scene.balloon, bx = wrap(W * 0.25 - viewScroll * 0.02 - time * 4, W + 120) - 60, by = safeTop + 58 + Math.sin(time * 0.6) * 5;
    ctx.drawImage(B.c, bx, by, B.w, B.h);
  }
  if (!T.night) {   // en liten fugleflokk krysser himmelen innimellom
    const ph = (time % 26) / 26;
    if (ph < 0.55) {
      const x0 = W + 30 - ph / 0.55 * (W + 90), y0 = safeTop + 150;
      ctx.strokeStyle = hexA(T.ink, 0.55); ctx.lineWidth = 1.2; ctx.lineCap = 'round';
      [[0, 0], [12, -6], [22, 4]].forEach(([dx, dy], i) => {
        const f = Math.sin(time * 9 + i) * 2.2, x = x0 + dx, y = y0 + dy + Math.sin(time * 1.5 + i) * 2;
        ctx.beginPath(); ctx.moveTo(x - 4, y - f); ctx.quadraticCurveTo(x - 2, y - 1, x, y); ctx.quadraticCurveTo(x + 2, y - 1, x + 4, y - f); ctx.stroke();
      });
    }
  }
}
function drawScenery(groundY) {
  const M = scene.mountains;
  drawLayer(M, groundY - M.h, 0.05);
  // seilbåt på fjorden
  const bx = wrap(W * 0.3 - viewScroll * 0.05 - time * 2.5, W + 60) - 30, by = groundY - 63 + Math.sin(time * 1.6) * 0.6;
  ctx.fillStyle = '#FFF8EC'; ctx.strokeStyle = T.ink; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(bx + 1, by - 2); ctx.lineTo(bx + 1, by - 13); ctx.lineTo(bx + 8, by - 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#D0583F'; ctx.beginPath(); ctx.moveTo(bx - 5, by - 1.5); ctx.lineTo(bx + 9, by - 1.5); ctx.lineTo(bx + 6.5, by + 1.6); ctx.lineTo(bx - 3, by + 1.6); ctx.closePath(); ctx.fill(); ctx.stroke();
  // åser med hytter + røyk fra pipene
  const Hl = scene.hills, hy = groundY - Hl.h;
  drawLayer(Hl, hy, 0.14, tx => {
    for (const c of Hl.chimneys) {
      const cx = tx + c.x, cy = hy + c.y;
      if (cx < -30 || cx > W + 10) continue;
      for (let k = 0; k < 6; k++) {
        const a = wrap(time * 0.32 + k / 6 + c.x * 0.013, 1), al = Math.min(1, a * 6) * (1 - a) * 0.55;
        ctx.fillStyle = T.night ? `rgba(225,220,245,${al})` : `rgba(255,255,255,${al})`;
        circle(ctx, cx - a * 18 + Math.sin(a * 7 + k) * 2, cy - a * 30, 1.6 + a * 4.5);
      }
    }
  });
  drawLayer(scene.forest, groundY - scene.forest.h, 0.3);
  drawLayer(scene.bushes, groundY - scene.bushes.h, 0.6);
}
function drawMotes() {
  if (T.night) {   // ildfluer som blinker
    for (const m of dust) {
      const a = Math.sin(time * m.f * 2 + m.p); if (a < 0.05) continue;
      const x = ip(m.px, m.x), y = ip(m.py, m.y);
      ctx.globalAlpha = a; ctx.drawImage(scene.glow.c, x - 7, y - 7, 14, 14);
      ctx.fillStyle = '#FFF6B0'; circle(ctx, x, y, 1.1);
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = 'rgba(255,250,235,.7)';
    for (const m of dust) circle(ctx, ip(m.px, m.x), ip(m.py, m.y), m.r);

}

/* ---------- Bjørkestammer ---------- */
function drawTrunkShadow(p, groundY) {
  ctx.fillStyle = hexA(T.ink, 0.16); ctx.beginPath(); ctx.ellipse(p.x + PIPE_W / 2 + 4, groundY + 3, PIPE_W / 2 + 9, 3.5, 0, 0, 7); ctx.fill();
}
function drawTrunk(p, groundY) {
  const ry = END_H / 2 - 0.5, by = p.top + p.gap;
  ctx.save(); ctx.translate(p.x, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  trunkBody(-10, p.top - ry, p.marksTop, p.top - ry, -1);
  trunkBody(by + ry, groundY + 2, p.marksBot, by + ry, 1);
  trunkDecor(p, p.top - ry, by + ry, groundY);
  trunkEnd(p, p.top - ry, false);
  trunkEnd(p, by + ry, true);
  ctx.restore();
  if (p.glow > 0) {   // varm glød i åpningen når man får poeng
    const cx = p.x + PIPE_W / 2, cy = p.top + p.gap / 2, gg = ctx.createRadialGradient(cx, cy, 2, cx, cy, p.gap * 0.6);
    gg.addColorStop(0, `rgba(255,236,170,${p.glow * 0.55})`); gg.addColorStop(1, 'rgba(255,236,170,0)');
    ctx.fillStyle = gg; ctx.fillRect(cx - p.gap * 0.6, cy - p.gap * 0.6, p.gap * 1.2, p.gap * 1.2);
  }
}
// stammekropp: sylinderskygge + svarte barkmerker, målt fra enden (så merkene følger stammen når den beveger seg)
function trunkBody(y0, y1, marks, ref, dir) {
  if (y1 <= y0) return;
  const w = PIPE_W;
  ctx.fillStyle = scene.trunkGrad; ctx.fillRect(0, y0, w, y1 - y0);
  ctx.strokeStyle = T.bark;
  for (const m of marks) {
    const y = ref + dir * m.d;
    if (dir < 0 ? y < y0 - 4 : y > y1 + 4) break;
    if (m.scar) {   // «øye» der en gren har sittet
      ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(m.x, y + 3); ctx.lineTo(m.x + 6, y - 2.5); ctx.lineTo(m.x + 12, y + 3); ctx.stroke();
    } else {
      ctx.lineWidth = m.th; ctx.beginPath(); ctx.moveTo(m.x, y); ctx.quadraticCurveTo(m.x + m.len / 2, y + 0.9, m.x + m.len, y); ctx.stroke();
    }
  }
  ctx.strokeStyle = hexA(T.ink, 0.6); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(0, y1); ctx.moveTo(w, y0); ctx.lineTo(w, y1); ctx.stroke();
}
// snittflate med årringer og en mosekant (høstløv på bevegelige stammer, lyng på smale)
function trunkEnd(p, y, upper) {
  const w = PIPE_W, cx = w / 2, rx = w / 2 + 1, ry = END_H / 2 - 0.5, r = rng(p.decor.moss + (upper ? 1 : 2));
  const autumn = p.variant === 'moving', heather = p.variant === 'narrow';
  const lip = autumn ? ['#F2994A', '#F7C548', '#E46B3C'] : [T.moss];
  const bumpsAt = (a0, a1, n, size) => {
    const out = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push([cx + Math.cos(a) * rx, y + Math.sin(a) * ry + (upper ? 0.5 : 1), size * (0.75 + r() * 0.5)]); }
    return out;
  };
  const lipBlob = pts => {
    blob(ctx, pts, lip[0], T.ink, 1.1, 0.7);
    if (lip.length > 1) for (const [x, yy, k] of pts) { ctx.fillStyle = lip[(r() * lip.length) | 0]; circle(ctx, x, yy, k * 0.8); }
    ctx.fillStyle = autumn ? 'rgba(255,255,255,.25)' : hexA('#FFFFFF', 0.22);
    for (const [x, yy, k] of pts) circle(ctx, x - k * 0.3, yy - k * 0.35, k * 0.35);
    if (heather) for (const [x, yy, k] of pts) if (r() < 0.6) { ctx.fillStyle = r() < 0.5 ? '#C58BE0' : '#E3B5F2'; circle(ctx, x + (r() - 0.5) * k, yy - k * 0.5, 1.2); }
  };
  if (upper) lipBlob(bumpsAt(Math.PI * 1.08, Math.PI * 1.92, 6, 2.4));   // mose bak på kanten
  ctx.fillStyle = upper ? T.cut : T.cutRing;
  ctx.beginPath(); ctx.ellipse(cx, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = upper ? T.cutRing : hexA(T.ink, 0.35); ctx.lineWidth = 1;
  for (const k of [0.68, 0.38]) { ctx.beginPath(); ctx.ellipse(cx + 1, y + 0.3, rx * k, ry * k, 0, 0, 7); ctx.stroke(); }
  ctx.strokeStyle = hexA(T.ink, 0.75); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(cx, y, rx, ry, 0, 0, 7); ctx.stroke();
  lipBlob(bumpsAt(-0.12, Math.PI + 0.12, 10, 3.2));   // forkant
  if (!upper) {   // små mosedrypp som henger under den øvre stammen
    for (let i = 0; i < 3; i++) { const x = 8 + r() * (w - 16), l = 3 + r() * 4; blob(ctx, [[x, y + ry + l, 1.6], [x, y + ry + l * 0.5, 1.4]], lip[0], T.ink, 0.9, 0.6); }
  }
}
function trunkDecor(p, upBot, loTop, groundY) {
  const d = p.decor, w = PIPE_W, autumn = p.variant === 'moving';
  if (d.toad) toadstool(d.toad < 0 ? -6 : w + 6, groundY + 2);
  if (d.fungus) { const y = loTop + d.fungusD; if (y < groundY - 16) fungus(d.fungus < 0 ? 0 : w, y, d.fungus); }
  if (d.sprigBot) { const y = loTop + d.sprigBotD; if (y < groundY - 20) sprig(d.sprigBot < 0 ? 0 : w, y, d.sprigBot, autumn); }
  if (d.sprigTop) { const y = upBot - d.sprigTopD; if (y > safeTop) sprig(d.sprigTop < 0 ? 0 : w, y, d.sprigTop, autumn); }
  if (d.owl) { const y = upBot - d.owlD; if (y > safeTop + 16) owl(w * 0.5, y, p.seed); }
}
function fungus(x, y, side) {   // kjuker (hyllesopp) på siden av stammen
  ctx.strokeStyle = hexA(T.ink, 0.8); ctx.lineWidth = 1.1;
  for (const [dy, s] of [[0, 1], [8, 0.75]]) {
    ctx.fillStyle = '#E9D2A6'; ctx.beginPath(); ctx.ellipse(x + side * 3 * s, y + dy, 8 * s, 3.4 * s, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#C9A578'; ctx.beginPath(); ctx.ellipse(x + side * 3 * s, y + dy + 1.2 * s, 6.5 * s, 1.6 * s, 0, 0, Math.PI); ctx.fill();
  }
}
function sprig(x, y, side, autumn) {   // liten kvist med blader
  ctx.strokeStyle = '#7A5A44'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + side * 7, y - 1, x + side * 13, y - 7); ctx.stroke();
  const leaves = autumn ? ['#F2994A', '#F7C548', '#E46B3C'] : [T.crown, T.moss, T.crown];
  [[6, -1.5, -0.3], [10, -5, 0.5], [13.5, -8, -0.2]].forEach(([dx, dy, a], i) => {
    ctx.save(); ctx.translate(x + side * dx, y + dy); ctx.rotate(side * (a - 0.6));
    ctx.fillStyle = leaves[i]; ctx.beginPath(); ctx.ellipse(side * 2.5, -1.5, 3.6, 2, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = hexA(T.ink, 0.6); ctx.lineWidth = 0.8; ctx.stroke(); ctx.restore();
  });
}
function owl(x, y, seed) {   // ugle som titter ut av et hull – blunker innimellom
  ctx.fillStyle = '#3B2F2A'; ctx.beginPath(); ctx.ellipse(x, y, 9, 10, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = hexA(T.ink, 0.9); ctx.lineWidth = 1.3; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, 8.3, 9.3, 0, 0, 7); ctx.clip();
  ctx.fillStyle = '#A9825F'; circle(ctx, x, y + 3, 8);
  ctx.fillStyle = '#C9A57F'; circle(ctx, x - 3.2, y + 1, 3.6); circle(ctx, x + 3.2, y + 1, 3.6);
  const closed = wrap(time + (seed % 7), 4.3) < 0.14;
  if (closed) { ctx.strokeStyle = '#3B2F2A'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 4.8, y + 1); ctx.lineTo(x - 1.6, y + 1); ctx.moveTo(x + 1.6, y + 1); ctx.lineTo(x + 4.8, y + 1); ctx.stroke(); }
  else { ctx.fillStyle = '#2B211D'; circle(ctx, x - 3.2, y + 1, 1.8); circle(ctx, x + 3.2, y + 1, 1.8); ctx.fillStyle = '#FFFFFF'; circle(ctx, x - 2.6, y + 0.4, 0.6); circle(ctx, x + 3.8, y + 0.4, 0.6); }
  ctx.fillStyle = '#F2B544'; ctx.beginPath(); ctx.moveTo(x - 1, y + 3.4); ctx.lineTo(x + 1, y + 3.4); ctx.lineTo(x, y + 5.2); ctx.closePath(); ctx.fill();
  ctx.restore();

  if (resumeT > 0) {   // nedtelling 3-2-1 før spillet fortsetter
    const n = Math.ceil(resumeT / 0.5), f = (resumeT % 0.5) / 0.5, pop = 1 + f * f * 0.5;
    ctx.save(); ctx.translate(W / 2, groundY * 0.42); ctx.scale(pop, pop); text(String(n), 0, 0, 56, { color: '#FFD27A', alpha: 0.4 + 0.6 * (1 - f * f), stroke: true }); ctx.restore();
    return;
  }
  text('Pause', W / 2, groundY * 0.36, 34, { color: '#FFD27A', stroke: true });
  const bw = 120, bh = 38, y = groundY * 0.36 + 40;
  button('resume', (W - bw) / 2, y, bw, bh, 'Fortsett', resumeGame, { size: 15 });
  button('pmenu', (W - bw) / 2, y + bh + 14, bw, bh, 'Meny', goMenu, { fill: '#FFF8EC', size: 15 });
}

function render() {
  const groundY = H - GROUND_H;
  ctx.save();
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  // dempet risting langs treffretningen; zoomer litt inn så kantene aldri blottlegges
  const env = shakeEnv();
  if (env > 0.05) {
    const w = fx.t * Math.PI * 2, o = Math.sin(w * 13) * env, q = Math.sin(w * 9.3 + 1) * env * 0.35;
    const z = 1 + 2 * env / Math.min(W, H);
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2 + fx.dx * o - fx.dy * q, -H / 2 + fx.dy * o + fx.dx * q);
  }
  viewScroll = ip(prevScroll, scroll);
  const pv = pipes.map(p => ({ ...p, x: ip(p.px, p.x), top: ip(p.ptop, p.top) }));
  const qv = powers.map(q => ({ ...q, x: ip(q.px, q.x), y: ip(q.py, q.y) }));

  drawSky(groundY);
  drawScenery(groundY);
  drawMotes();
  for (const p of pv) drawTrunkShadow(p, groundY);
  for (const p of pv) drawTrunk(p, groundY);
  for (const q of qv) drawPower(q);
  drawLayer(scene.ground, groundY - 10, 1);
  drawParticles();
  drawBird();
  for (const k in hud) delete hud[k];

  const topY = safeTop + 26;

  if (state === State.MENU) {
    const ty = topY + 40 + Math.sin(time * 2.4) * 3;
    text('Pixelfugl', W / 2, ty, 42, { color: '#FFD27A', stroke: true });
    text('Trykk for å flakse', W / 2, groundY * 0.58, 15, { weight: 600, stroke: true });
    if (best > 0) text(`Beste (${D.label.toLowerCase()}): ${best}`, W / 2, groundY * 0.58 + 24, 12, { weight: 600, color: '#FFD27A', stroke: true });
    const bw = 76, bh = 30, gapX = 8, total = bw * 3 + gapX * 2, x0 = (W - total) / 2, y0 = groundY * 0.58 + 52;
    text('Vanskelighet', W / 2, y0 - 12, 11, { weight: 600, stroke: true, shadow: false });
    let i = 0;
    for (const k in DIFFS) { const on = k === diffName; button('d_' + k, x0 + i * (bw + gapX), y0, bw, bh, DIFFS[k].label, () => setDiff(k), { fill: DIFFS[k].color, active: on }); i++; }
    const w3 = 80, g3 = 8, x3 = (W - (w3 * 3 + g3 * 2)) / 2, y3 = groundY + 32;
    button('sound', x3, y3, w3, 30, Sound.sfxMuted ? 'Lyd av' : 'Lyd på', () => Sound.toggleSfx(), { active: !Sound.sfxMuted, size: 12 });
    button('music', x3 + w3 + g3, y3, w3, 30, Sound.musMuted ? 'Musikk av' : 'Musikk', () => Sound.toggleMusic(), { active: !Sound.musMuted, fill: '#FFB8CB', size: 12 });
    button('theme', x3 + (w3 + g3) * 2, y3, w3, 30, themeName === 'day' ? 'Dag' : 'Natt', toggleTheme, { fill: themeName === 'day' ? '#FFE08A' : '#CFC6F4', size: 12 });
  }

  if (state === State.READY) {
    text('Klar?', W / 2, topY + 40, 32, { color: '#FFD27A', stroke: true });
    text(D.label, W / 2, topY + 70, 13, { weight: 600, color: D.color, stroke: true, shadow: false });
    const hy = groundY * 0.42 + 30 + Math.sin(time * 6) * 3;
    ctx.fillStyle = '#FFF8EC'; ctx.strokeStyle = UI_INK; ctx.lineWidth = 1.5; rr(W / 2 + 36, hy, 20, 30, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = UI_INK; rr(W / 2 + 44, hy + 5, 4, 10, 2); ctx.fill();
    text('Trykk', W / 2, groundY * 0.42 + 80, 14, { weight: 600, stroke: true });
  }

  if (state === State.PLAY || state === State.DEAD) {
    const ds = time - scoreT, pop = ds < 0.8 && !reduceMotion ? 1 + 0.45 * Math.exp(-ds * 7) * Math.cos(ds * 22) : 1;
    ctx.save(); ctx.translate(W / 2, topY + 16); ctx.scale(pop, pop); text(String(score), 0, 0, 40, { stroke: true }); ctx.restore();
    drawActiveHud(topY + 46);
    if (state === State.PLAY && !paused) drawPauseButton(W - 46, safeTop + 12, 34);
  }

  if (state === State.OVER) {
    const e = Math.min(1, overT / 0.55), ease = easeOutCubic(e), back = reduceMotion ? ease : easeOutBack(e);
    const pw = 236, ph = 132, pxx = (W - pw) / 2, py = groundY * 0.46 - ph / 2 + (1 - back) * 80;
    ctx.fillStyle = `rgba(40,28,50,${(0.22 * ease).toFixed(3)})`; ctx.fillRect(0, 0, W, H);   // demp bakgrunnen bak panelet
    const tk = Math.min(1, Math.max(0, (overT - 0.1) / 0.45)), ts = reduceMotion ? 1 : easeOutBack(tk);
    ctx.save(); ctx.translate(W / 2, py - 34); ctx.scale(ts, ts);
    text(overTitle, 0, 0, 30, { color: newBest ? '#FFD27A' : '#FFA28C', stroke: true, alpha: Math.min(1, tk * 2) });
    ctx.restore();
    panel(pxx, py, pw, ph);
    // medaljen (eller egget) snurrer inn når opptellingen er ferdig
    const mk = Math.min(1, Math.max(0, (overT - 0.55 - score / 30) / 0.45)), ms = reduceMotion ? mk : easeOutBack(mk);
    const m = medalFor(score), mx = pxx + 50, my = py + 63;
    if (mk > 0) {
      ctx.save(); ctx.translate(mx, my); ctx.rotate((1 - mk) * -1.4); ctx.scale(ms, ms); ctx.translate(-mx, -my);
      if (m) drawMedal(mx, py + 64, m); else drawEgg(mx, py + 62);
      ctx.restore();
      ctx.globalAlpha = mk;
      if (m) text(m[2], mx, py + 103, 11, { color: UI_INK, shadow: false, weight: 600, alpha: mk });
      else {
        text('Nesten!', mx, py + 101, 11, { color: UI_INK, shadow: false, weight: 600, alpha: mk });
        text(`${10 - score} til bronse`, mx, py + 114, 9, { color: '#9A7B5E', shadow: false, weight: 600, alpha: mk });
      }
      ctx.globalAlpha = 1;
    }
    const shown = overShown;
    text('Poeng', pxx + pw - 28, py + 30, 12, { align: 'right', color: '#9A7B5E', shadow: false, weight: 600 });
    text(String(shown), pxx + pw - 28, py + 54, 28, { align: 'right', color: UI_INK, shadow: false });
    text('Beste', pxx + pw - 28, py + 84, 12, { align: 'right', color: '#9A7B5E', shadow: false, weight: 600 });
    text(String(best), pxx + pw - 28, py + 108, 28, { align: 'right', color: UI_INK, shadow: false });
    if (newBest && shown === score) {
      ctx.fillStyle = '#FFA28C'; rr(pxx + pw - 120, py + 74, 34, 18, 9); ctx.fill(); ctx.strokeStyle = UI_INK; ctx.lineWidth = 1.4; ctx.stroke();
      text('Ny!', pxx + pw - 103, py + 83.5, 11, { shadow: false, weight: 600, color: '#FFFDF6', stroke: true });
    }
    text(D.label, pxx + 50, py + 22, 11, { color: D.ink, shadow: false, weight: 600 });
    // tydelige valg i stedet for «trykk hvor som helst»: spill igjen, eller tilbake til menyen
    if (overT > 0.9) {
      const k = Math.min(1, (overT - 0.9) / 0.3), slide = (1 - (1 - Math.pow(1 - k, 3))) * 24;
      const bh = 38, b1 = 128, b2 = 92, gap = 10, x0 = (W - b1 - b2 - gap) / 2, by = py + ph + 22 + slide;
      button('again', x0, by, b1, bh, 'Spill igjen', goReady, { size: 15 });
      button('menu', x0 + b1 + gap, by, b2, bh, 'Meny', goMenu, { fill: '#FFF8EC', size: 15 });
    }
  }

  // vignett: varm og lys om dagen, mørkeblå om natten
  ctx.drawImage(scene.vignette.c, 0, 0, scene.vignette.w, scene.vignette.h);
  if (state === State.PLAY && active.slow > 0) {
    const sg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
    sg.addColorStop(0, 'rgba(180,155,232,0)'); sg.addColorStop(1, 'rgba(180,155,232,.3)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  }
  // myk farget kant ved treff (erstatter hvit fullskjerm-blits)
  if (fx.tint > 0) {
    const tg = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.75);
    tg.addColorStop(0, `rgba(${fx.rgb},0)`); tg.addColorStop(1, `rgba(${fx.rgb},${(fx.tint * 0.45).toFixed(3)})`);
    ctx.fillStyle = tg; ctx.fillRect(0, 0, W, H);
  }
  if (paused) drawPauseOverlay(groundY);
  if (transitionT > 0) {   // overgang: en sirkel som åpner seg rundt fuglen (eller en enkel toning ved redusert bevegelse)
    if (reduceMotion) { ctx.fillStyle = `rgba(40,28,50,${transitionT * 0.45})`; ctx.fillRect(0, 0, W, H); }
    else {
      const k = easeOutCubic(1 - transitionT), R = Math.hypot(W, H) * (0.12 + 0.88 * k);
      ctx.fillStyle = `rgba(40,28,50,${(0.75 * (1 - k * 0.5)).toFixed(3)})`;
      ctx.beginPath(); ctx.rect(-20, -20, W + 40, H + 40); ctx.arc(ip(bird.px, bird.x), ip(bird.py, bird.y), R, 0, Math.PI * 2); ctx.fill('evenodd');
    }
  }
  ctx.restore();
}

/* ---------- Størrelse ---------- */
function resize() {
  // maks 2× skjermpiksler: ~42 % færre piksler på 2,6×-telefoner, uten synlig forskjell i den myke tegnestilen
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = vw / LOGICAL_W; W = LOGICAL_W; H = Math.round(vh / scale);
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);visibility:hidden';
  document.body.appendChild(probe); safeTop = Math.round(probe.getBoundingClientRect().top / scale); probe.remove();
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
  const groundY = H - GROUND_H;
  buildScene(); initAmbient();
  if (bird && state !== State.PLAY) bird.y = bird.py = groundY * 0.42;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- Løkke: fast fysikk-steg, render hver frame ---------- */
let lastTime = 0, acc = 0;
function loop(t) {
  requestAnimationFrame(loop);   // først: en feil i ett bilde skal ikke stoppe spillet for godt
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / 1000; lastTime = t;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n++ < 12) { update(STEP); acc -= STEP; }
  alpha = clamp(acc / STEP, 0, 1);   // hvor langt vi er mellom forrige og neste fysikk-steg
  render();
}

/* ---------- PWA ---------- */
const installBtn = document.getElementById('install');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBtn.classList.add('show'); });
installBtn.addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.classList.remove('show'); });
window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

document.documentElement.style.setProperty('--sky', T.skyTop);
document.querySelector('meta[name=theme-color]').content = T.skyTop;
resize(); goMenu(); Sound.setNight(T.night);
const start = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("700 20px Fredoka"), document.fonts.load("600 14px Fredoka")]).finally(start); else start();
</script>
