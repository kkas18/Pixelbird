<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5BC8F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixelfugl">
<meta name="description" content="Pixelfugl – et moderne flakse-spill. Trykk for å flakse.">
<title>Pixelfugl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root { --sky: #5BC8F0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: var(--sky);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: 'Fredoka', system-ui, sans-serif;
  }
  body { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #install {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: none; border: 0; cursor: pointer; border-radius: 999px;
    font: 600 15px/1 'Fredoka', system-ui, sans-serif; color: #2B2400;
    background: #FFD23F; padding: 14px 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,.22), inset 0 -3px 0 rgba(0,0,0,.12);
  }
  #install:active { transform: translateX(-50%) scale(.96); }
  #install.show { display: block; }
  #fontprobe { position: absolute; opacity: 0; pointer-events: none; left: -9999px; font-weight: 700; }
</style>
</head>
<body>
<canvas id="game" aria-label="Pixelfugl spill" role="img"></canvas>
<button id="install" type="button">Installer Pixelfugl</button>
<span id="fontprobe">0123456789</span>

<script>
'use strict';
/* ============================================================
   PIXELFUGL v3
   – Tidsbasert fysikk (px/s, px/s²) med fast tidssteg 120 Hz
   – Fem parallakse-lag, lysstråler, støv, vignett
   – Generert chiptune-musikk (Web Audio)
   Logisk bredde 288 px, høyde følger skjermen.
   ============================================================ */

const LOGICAL_W = 288;
const STEP = 1 / 120;               // fysikk-steg (sekunder)
const PIPE_W = 56, PIPE_CAP_H = 26, PIPE_CAP_R = 7;
const GROUND_H = 92;
const BIRD_X = 78, BIRD_R = 11, POWER_R = 13;
const TERMINAL = 560;               // px/s
const AIR_DRAG = 0.35;              // 1/s
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- Vanskelighetsgrader (alle hastigheter i px/s) ---------- */
const DIFFS = {
  lett:   { label: 'Lett',   gap: 152, speed: 118, spacing: 192, gravity: 1050, flap: -330, variantsFrom: 14, color: '#5DD07A' },
  normal: { label: 'Normal', gap: 130, speed: 136, spacing: 172, gravity: 1180, flap: -345, variantsFrom: 8,  color: '#FFD23F' },
  hard:   { label: 'Hard',   gap: 112, speed: 160, spacing: 156, gravity: 1320, flap: -362, variantsFrom: 4,  color: '#FF6B57' }
};
let diffName = localStorage.getItem('pf.diff') || 'normal';
if (!DIFFS[diffName]) diffName = 'normal';
let D = DIFFS[diffName];
const bestKey = () => 'pf.best.' + diffName;
let best = +localStorage.getItem(bestKey()) || 0;

const POWERS = {
  shield: { label: 'Skjold',     color: '#3FA9F5', glow: 'rgba(63,169,245,.55)', dur: 0 },
  slow:   { label: 'Sakte film', color: '#B06BFF', glow: 'rgba(176,107,255,.55)', dur: 6 },
  double: { label: 'Dobbelt',    color: '#FFB800', glow: 'rgba(255,184,0,.55)',   dur: 8 }
};

/* ---------- Tema ---------- */
const THEMES = {
  day: {
    skyTop: '#4FB9EE', skyMid: '#8CDCF7', skyBot: '#DDF6FF', sun: '#FFF3B0', rays: 'rgba(255,255,255,.10)',
    cloud: 'rgba(255,255,255,.94)', cloudShade: 'rgba(200,232,245,.9)',
    mountain: '#B7DFF0', mountainSnow: '#EEF9FF', forest: '#7FC8A0', forestDark: '#5FAE83',
    hill: '#7BD389', hillShade: '#58B868', bush: '#4FA85C', bushLight: '#6CC276',
    groundTop: '#7FCB4A', groundTop2: '#5FAE36', ground: '#EBDDA5', groundStripe: '#DCCC8E', path: '#E2D398',
    pipe: '#5EBF3E', pipeLight: '#A3EA7A', pipeDark: '#347F24', pipeEdge: 'rgba(0,0,0,.2)',
    text: '#FFFFFF', textShadow: 'rgba(0,40,60,.35)', stars: false, vignette: 'rgba(0,30,60,.18)'
  },
  night: {
    skyTop: '#141C38', skyMid: '#2A3A66', skyBot: '#4A5F92', sun: '#FFF7D6', rays: 'rgba(255,255,255,.04)',
    cloud: 'rgba(130,150,200,.5)', cloudShade: 'rgba(90,110,160,.4)',
    mountain: '#3A4F78', mountainSnow: '#6E82AE', forest: '#2E5F5A', forestDark: '#234A47',
    hill: '#2F7A50', hillShade: '#245E3C', bush: '#1F5A36', bushLight: '#2C7247',
    groundTop: '#4B9A32', groundTop2: '#387A26', ground: '#BFB27E', groundStripe: '#AE9F6C', path: '#B8AA76',
    pipe: '#4FA836', pipeLight: '#86D262', pipeDark: '#2A6B1E', pipeEdge: 'rgba(0,0,0,.28)',
    text: '#FFFFFF', textShadow: 'rgba(0,0,20,.5)', stars: true, vignette: 'rgba(0,0,20,.35)'
  }
};
const hr = new Date().getHours();
let themeName = localStorage.getItem('pf.theme') || ((hr >= 20 || hr < 6) ? 'night' : 'day');
let T = THEMES[themeName];

/* ============================================================
   LYD + MUSIKK (Web Audio, alt syntetisert)
   ============================================================ */
const Audio = (() => {
  let ac = null, master, sfxGain, musGain, musFilter;
  let sfxMuted = localStorage.getItem('pf.muted') === '1';
  let musMuted = localStorage.getItem('pf.music') === '1';
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  function ensure() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
      sfxGain = ac.createGain(); sfxGain.gain.value = sfxMuted ? 0 : 1; sfxGain.connect(master);
      musFilter = ac.createBiquadFilter(); musFilter.type = 'lowpass'; musFilter.frequency.value = 900; musFilter.Q.value = 0.7;
      musGain = ac.createGain(); musGain.gain.value = musMuted ? 0 : 0.55;
      musGain.connect(musFilter).connect(master);
      Music.init();
    }
    if (ac.state === 'suspended') ac.resume();
  }
  // generiske stemmer
  function voice(dest, freq, t0, dur, type, vol, opts = {}) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t0 + dur);
    const a = opts.attack || 0.005, r = opts.release || dur * 0.6;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + a);
    g.gain.setValueAtTime(vol, Math.max(t0 + a, t0 + dur - r)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = o;
    if (opts.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.lp; o.connect(f); node = f; }
    node.connect(g).connect(dest); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dest, t0, dur, vol, hp = 3000, lp = 12000) {
    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = ac.createBufferSource(), h = ac.createBiquadFilter(), l = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; h.type = 'highpass'; h.frequency.value = hp; l.type = 'lowpass'; l.frequency.value = lp; g.gain.value = vol;
    s.connect(h).connect(l).connect(g).connect(dest); s.start(t0);
  }
  function kick(t0) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(42, t0 + 0.12);
    g.gain.setValueAtTime(0.7, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
    o.connect(g).connect(musGain); o.start(t0); o.stop(t0 + 0.22);
  }

  /* ---------- Sequencer: 8 takter, 128 BPM, C-dur ---------- */
  const Music = (() => {
    const BPM = 128, STEPS = 64;           // 8 takter × 8 åttendedeler
    const eighth = 60 / BPM / 2;
    // Akkorder per takt: C  G  Am  F  C  G  F  G
    const CHORDS = [[48, 52, 55], [43, 47, 50], [45, 48, 52], [41, 45, 48], [48, 52, 55], [43, 47, 50], [41, 45, 48], [43, 47, 50]];
    const BASS = [48, 48, 55, 48,  43, 43, 50, 43,  45, 45, 52, 45,  41, 41, 48, 41,  48, 48, 55, 48,  43, 43, 50, 43,  41, 41, 48, 41,  43, 47, 50, 55];
    // Lead (0 = pause), to fraser à 4 takter
    const LEAD = [
      72, 0, 76, 79, 76, 72, 79, 0,   74, 0, 79, 74, 71, 74, 79, 0,   69, 0, 72, 76, 72, 69, 76, 0,   77, 76, 74, 72, 74, 0, 0, 0,
      72, 0, 76, 79, 81, 79, 76, 72,  74, 0, 79, 83, 81, 79, 74, 0,   69, 72, 76, 81, 79, 76, 72, 69, 77, 79, 81, 83, 84, 0, 0, 0
    ];
    const KICK  = [1, 0, 0, 0, 1, 0, 1, 0];
    const SNARE = [0, 0, 1, 0, 0, 0, 1, 0];
    let step = 0, nextTime = 0, timer = null, playing = false, mode = 'menu', energy = 0;

    function schedule(i, t) {
      const bar = (i >> 3) % 8, sub = i & 7;
      const chord = CHORDS[bar];
      // bass – triangel, hver åttendedel i to-noters puls
      const b = BASS[(i >> 1) % 32];
      voice(musGain, midi(b), t, eighth * 0.9, 'triangle', 0.32, { lp: 800, release: eighth * 0.4 });
      // arpeggio-pad – myk sag
      const an = chord[(sub + (bar & 1)) % 3] + 12 + (sub >= 4 ? 12 : 0);
      voice(musGain, midi(an), t, eighth * 0.85, 'sawtooth', 0.045, { lp: 1800, attack: 0.02, release: eighth * 0.5 });
      // lead – pulsbølge lengre nede i miksen
      const ln = LEAD[i % STEPS];
      if (ln) {
        voice(musGain, midi(ln), t, eighth * 0.95, 'square', 0.085, { lp: 2600, release: eighth * 0.35 });
        voice(musGain, midi(ln) * 1.003, t + 0.012, eighth * 0.9, 'triangle', 0.05, { release: eighth * 0.35 }); // lett chorus
      }
      // trommer bare i "play"-modus
      if (mode === 'play') {
        if (KICK[sub]) kick(t);
        if (SNARE[sub]) noise(musGain, t, 0.12, 0.28, 1500, 7000);
        noise(musGain, t, 0.03, sub & 1 ? 0.06 : 0.1, 6000, 14000); // hi-hat
      }
    }
    function tick() {
      while (nextTime < ac.currentTime + 0.15) { schedule(step, nextTime); step++; nextTime += eighth; }
    }
    return {
      init() {},
      start() { if (playing || !ac) return; playing = true; step = 0; nextTime = ac.currentTime + 0.05; timer = setInterval(tick, 40); },
      stop() { playing = false; clearInterval(timer); timer = null; },
      setMode(m) {
        mode = m; if (!ac) return;
        const t = ac.currentTime;
        musFilter.frequency.cancelScheduledValues(t);
        musFilter.frequency.setTargetAtTime(m === 'play' ? 9000 : 900, t, 0.35);
      },
      slowmo(on) { if (!ac) return; musFilter.frequency.setTargetAtTime(on ? 500 : (mode === 'play' ? 9000 : 900), ac.currentTime, 0.25); },
      get playing() { return playing; }
    };
  })();

  return {
    unlock() { ensure(); if (!Music.playing) Music.start(); },
    music: Music,
    flap() { if (!ac) return; voice(sfxGain, 540, ac.currentTime, 0.09, 'triangle', 0.18, { slide: 860 }); },
    point() { if (!ac) return; const t = ac.currentTime; voice(sfxGain, 880, t, 0.07, 'sine', 0.18); voice(sfxGain, 1320, t + 0.07, 0.14, 'sine', 0.18); },
    power() { if (!ac) return; const t = ac.currentTime; [660, 990, 1320].forEach((f, i) => voice(sfxGain, f, t + i * 0.08, 0.16, 'triangle', 0.16)); },
    shieldPop() { if (!ac) return; noise(sfxGain, ac.currentTime, 0.12, 0.2, 1000, 5000); voice(sfxGain, 1200, ac.currentTime, 0.2, 'sine', 0.14, { slide: 300 }); },
    hit() { if (!ac) return; noise(sfxGain, ac.currentTime, 0.2, 0.4, 100, 1200); voice(sfxGain, 160, ac.currentTime, 0.22, 'sawtooth', 0.16, { slide: 60 }); },
    die() { if (!ac) return; voice(sfxGain, 440, ac.currentTime + 0.15, 0.5, 'triangle', 0.14, { slide: 110 }); },
    thud() { if (!ac) return; noise(sfxGain, ac.currentTime, 0.1, 0.3, 60, 500); },
    sting() { if (!ac) return; const t = ac.currentTime; [67, 63, 60, 55].forEach((n, i) => voice(musGain, midi(n), t + i * 0.16, 0.3, 'square', 0.1, { lp: 2000 })); },
    swoosh() { if (!ac) return; noise(sfxGain, ac.currentTime, 0.16, 0.1, 1500, 6000); },
    tick() { if (!ac) return; voice(sfxGain, 1500, ac.currentTime, 0.03, 'square', 0.05); },
    toggleSfx() { sfxMuted = !sfxMuted; localStorage.setItem('pf.muted', sfxMuted ? '1' : '0'); if (sfxGain) sfxGain.gain.setTargetAtTime(sfxMuted ? 0 : 1, ac.currentTime, 0.02); },
    toggleMusic() { musMuted = !musMuted; localStorage.setItem('pf.music', musMuted ? '1' : '0'); if (musGain) musGain.gain.setTargetAtTime(musMuted ? 0 : 0.55, ac.currentTime, 0.1); },
    get sfxMuted() { return sfxMuted; }, get musMuted() { return musMuted; }
  };
})();
const buzz = ms => { if ('vibrate' in navigator) try { navigator.vibrate(ms); } catch (e) {} };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Canvas ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = 1, scale = 1, W = LOGICAL_W, H = 560, safeTop = 0;

/* ---------- Tilstand ---------- */
const State = { MENU: 0, READY: 1, PLAY: 2, DEAD: 3, OVER: 4 };
let state = State.MENU;
let score = 0, time = 0, scorePop = 0;
let scroll = 0;                       // total avstand rullet (px) – driver alle parallakse-lag
let bird, pipes = [], particles = [], powers = [], floats = [], trail = [], dust = [], stars = [];
let shake = 0, flash = 0, overT = 0, transitionT = 0, newBest = false, groundBounced = false;
let active = { shield: false, slow: 0, double: 0 };
let timeScale = 1, slowWas = false;
let deferredPrompt = null;
const hud = {};

function resetBird() { bird = { x: BIRD_X, y: 0, vx: 0, vy: 0, rot: 0, angVel: 0, flapT: 9, sx: 1, sy: 1 }; }
function goMenu() { state = State.MENU; resetBird(); pipes = []; particles = []; powers = []; floats = []; trail = []; score = 0; Audio.music.setMode('menu'); }
function goReady() {
  state = State.READY; resetBird(); pipes = []; particles = []; powers = []; floats = []; trail = []; score = 0; newBest = false; groundBounced = false;
  active = { shield: false, slow: 0, double: 0 }; timeScale = 1; transitionT = 1; Audio.swoosh(); Audio.music.setMode('menu');
}
function goPlay() { state = State.PLAY; spawnPipe(W + 60); Audio.music.setMode('play'); }

function spawnPipe(x) {
  const playH = H - GROUND_H;
  let gap = Math.max(D.gap * 0.72, D.gap - Math.min(score, 30) * 0.9);
  let variant = 'normal';
  if (score >= D.variantsFrom) { const r = Math.random(); if (r < 0.24) variant = 'moving'; else if (r < 0.44) variant = 'narrow'; }
  if (variant === 'narrow') gap *= 0.8;
  const margin = 40 + safeTop, amp = variant === 'moving' ? 26 : 0;
  const top = margin + amp + Math.random() * (playH - gap - margin - 40 - amp * 2);
  const p = { x, top, baseTop: top, gap, variant, amp, phase: Math.random() * Math.PI * 2, freq: 2.2 + Math.random() * 1.2, scored: false, glow: 0 };
  pipes.push(p);
  if (score >= 3 && variant !== 'narrow' && Math.random() < 0.16 && !powers.some(q => q.x > W - 100)) {
    const keys = Object.keys(POWERS);
    const kind = active.shield ? (Math.random() < 0.5 ? 'slow' : 'double') : keys[(Math.random() * keys.length) | 0];
    powers.push({ x: x + PIPE_W / 2, pipe: p, kind, t: Math.random() * 10, taken: false });
  }
}

/* ---------- Partikler ---------- */
function burst(x, y, n, colors, spd, life, grav = 700, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life, max: life, grav, c: colors[(Math.random() * colors.length) | 0], r: size * (0.5 + Math.random()) });
  }
}
function floatText(x, y, txt, color) { floats.push({ x, y, txt, color, life: 0.85, max: 0.85 }); }

/* ---------- Input ---------- */
function flap() {
  Audio.unlock();
  if (state === State.MENU) { goReady(); return; }
  if (state === State.READY) goPlay();
  if (state === State.PLAY) {
    // bland inn i stedet for å overstyre: litt av eksisterende oppdrift beholdes
    bird.vy = Math.min(bird.vy, 0) * 0.25 + D.flap;
    bird.flapT = 0; bird.sy = 1.22; bird.sx = 0.84;
    bird.angVel = -9;
    Audio.flap(); buzz(8);
    burst(bird.x - 12, bird.y + 6, 4, ['#FFFFFF', '#CFF1FF'], 90, 0.35, 250, 2);
    return;
  }
  if (state === State.OVER && overT > 0.7) goReady();
}
function onPointer(e) {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale;
  for (const k in hud) {
    const b = hud[k];
    if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4) { Audio.unlock(); b.fn(); Audio.tick(); buzz(6); return; }
  }
  flap();
}
canvas.addEventListener('pointerdown', onPointer, { passive: false });
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) lastTime = 0; });

function setDiff(name) { diffName = name; D = DIFFS[name]; localStorage.setItem('pf.diff', name); best = +localStorage.getItem(bestKey()) || 0; }
function toggleTheme() {
  themeName = themeName === 'day' ? 'night' : 'day'; T = THEMES[themeName]; localStorage.setItem('pf.theme', themeName);
  document.querySelector('meta[name=theme-color]').content = T.skyTop; document.documentElement.style.setProperty('--sky', T.skyTop);
}

/* ---------- Kollisjon: sirkel mot avrundet rektangel ---------- */
function circleRRect(cx, cy, r, x, y, w, h, rad) {
  const ix = clamp(cx, x + rad, x + w - rad), iy = clamp(cy, y + rad, y + h - rad);
  const dx = cx - ix, dy = cy - iy;
  return dx * dx + dy * dy < (r + rad) * (r + rad);
}
function hitsPipe(p, groundY) {
  const r = BIRD_R - 1;
  return circleRRect(bird.x, bird.y, r, p.x, -20, PIPE_W, p.top - PIPE_CAP_H + 22, 0)
      || circleRRect(bird.x, bird.y, r, p.x - 5, p.top - PIPE_CAP_H, PIPE_W + 10, PIPE_CAP_H, PIPE_CAP_R)
      || circleRRect(bird.x, bird.y, r, p.x - 5, p.top + p.gap, PIPE_W + 10, PIPE_CAP_H, PIPE_CAP_R)
      || circleRRect(bird.x, bird.y, r, p.x, p.top + p.gap + PIPE_CAP_H - 2, PIPE_W, groundY, 0);
}

/* ---------- Oppdatering (dt i sekunder) ---------- */
function update(dt) {
  time += dt;
  const wantSlow = state === State.PLAY && active.slow > 0;
  timeScale = lerp(timeScale, wantSlow ? 0.55 : 1, 1 - Math.pow(0.001, dt));
  if (wantSlow !== slowWas) { Audio.music.slowmo(wantSlow); slowWas = wantSlow; }
  const gdt = dt * timeScale;      // spilltid
  const scrolling = state !== State.DEAD && state !== State.OVER;
  if (scrolling) scroll += D.speed * gdt;

  transitionT = Math.max(0, transitionT - dt * 3.5);
  shake = Math.max(0, shake - dt * 55);
  flash = Math.max(0, flash - dt * 4.5);
  scorePop = Math.max(0, scorePop - dt * 5);

  const groundY = H - GROUND_H, idleY = groundY * 0.42;

  if (state === State.MENU || state === State.READY) {
    bird.y = idleY + Math.sin(time * 3.2) * 6; bird.rot = Math.sin(time * 3.2 + 1) * 0.08; bird.flapT += dt;
    bird.sx = lerp(bird.sx, 1, dt * 10); bird.sy = lerp(bird.sy, 1, dt * 10);
  }

  if (state === State.PLAY) {
    // tyngdekraft + luftmotstand + terminalfart
    bird.vy += D.gravity * gdt;
    bird.vy -= bird.vy * AIR_DRAG * gdt;
    bird.vy = clamp(bird.vy, -900, TERMINAL);
    bird.y += bird.vy * gdt;
    bird.flapT += gdt;
    // rotasjon som fjær mot målvinkel
    const target = bird.vy < 0 ? -0.45 : clamp((bird.vy - 60) / 380, 0, 1) * 1.4;
    const k = bird.vy < 0 ? 140 : 40, damp = bird.vy < 0 ? 16 : 10;
    bird.angVel += ((target - bird.rot) * k - bird.angVel * damp) * gdt;
    bird.rot += bird.angVel * gdt;
    // squash & stretch – fjærer tilbake til 1, strekkes litt ved fall
    const fallStretch = clamp(bird.vy / TERMINAL, 0, 1) * 0.1;
    bird.sx = lerp(bird.sx, 1 - fallStretch * 0.5, 1 - Math.pow(0.0005, gdt));

}

function drawParticles() {
  for (const q of particles) { ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const f of floats) text(f.txt, f.x, f.y, 13, { color: f.color, alpha: clamp(f.life / 0.3, 0, 1) });
}
function drawDust() {
  ctx.fillStyle = T.stars ? 'rgba(255,247,214,.35)' : 'rgba(255,255,255,.55)';
  for (const m of dust) { ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill(); }
}

function button(key, x, y, w, h, label, fn, opts = {}) {
  const { fill = '#FFD23F', color = '#2B2400', size = 13, active = true } = opts;
  hud[key] = { x, y, w, h, fn };
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(x, y + 3, w, h, h / 2); ctx.fill();
  ctx.fillStyle = active ? fill : 'rgba(255,255,255,.45)'; rr(x, y, w, h, h / 2); ctx.fill();
  if (active) { ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(x + 4, y + 3, w - 8, h * 0.38, h / 2); ctx.fill(); }
  text(label, x + w / 2, y + h / 2 + 0.5, size, { color: active ? color : 'rgba(43,36,0,.7)', shadow: false, weight: 600 });
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(x, y + 6, w, h, 18); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.96)'; rr(x, y, w, h, 18); ctx.fill();
}
function medalFor(s) {
  if (s >= 40) return ['#E3EEF8', '#9FB8CC', 'Platina'];
  if (s >= 30) return ['#FFD23F', '#D19A00', 'Gull'];
  if (s >= 20) return ['#E4E4E4', '#9A9A9A', 'Sølv'];
  if (s >= 10) return ['#E0955C', '#9C5B2A', 'Bronse'];
  return null;
}
function drawMedal(x, y, m) {
  const [c, d] = m;
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.arc(x, y + 2, 20, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(x - 6, y - 6, 2, x, y, 20); g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.35, c); g.addColorStop(1, d);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
  ctx.strokeStyle = d; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.stroke();
  ctx.fillStyle = d; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 4 : 9, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  if (!reduceMotion) { const sp = (time * 1.4) % 1; if (sp < 0.25) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x - 12 + sp * 96, y - 12, 2.5, 0, 7); ctx.fill(); } }
}
function drawActiveHud(y) {
  const items = [];
  if (active.shield) items.push(['shield', 1]);
  if (active.slow > 0) items.push(['slow', active.slow / POWERS.slow.dur]);
  if (active.double > 0) items.push(['double', active.double / POWERS.double.dur]);
  const w = 118, h = 20; let yy = y;
  for (const [k, frac] of items) {
    const P = POWERS[k], x = (W - w) / 2;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(x, yy, w, h, h / 2); ctx.fill();
    ctx.save(); rr(x, yy, w, h, h / 2); ctx.clip(); ctx.fillStyle = P.color; ctx.fillRect(x, yy, w * frac, h); ctx.restore();
    text(P.label, x + w / 2, yy + h / 2 + 0.5, 11, { shadow: false, weight: 600 });
    yy += h + 6;
  }
}

function render() {
  const groundY = H - GROUND_H;
  ctx.save();
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawSky(groundY);
  drawLayers(groundY);
  drawDust();
  for (const p of pipes) drawPipeShadow(p, groundY);
  for (const p of pipes) drawPipe(p, groundY);
  for (const q of powers) drawPower(q);
  drawGround(groundY);
  drawParticles();
  drawBird();
  for (const k in hud) delete hud[k];

  const topY = safeTop + 26;

  if (state === State.MENU) {
    const ty = topY + 40 + Math.sin(time * 2.4) * 3;
    text('Pixelfugl', W / 2, ty, 40, { color: '#FFD23F' });
    text('Trykk for å flakse', W / 2, groundY * 0.58, 15, { weight: 600 });
    if (best > 0) text(`Beste (${D.label.toLowerCase()}): ${best}`, W / 2, groundY * 0.58 + 24, 12, { weight: 600, color: '#FFD23F' });
    const bw = 76, bh = 30, gapX = 8, total = bw * 3 + gapX * 2, x0 = (W - total) / 2, y0 = groundY * 0.58 + 52;
    text('Vanskelighet', W / 2, y0 - 12, 11, { weight: 600, alpha: 0.85 });
    let i = 0;
    for (const k in DIFFS) { const on = k === diffName; button('d_' + k, x0 + i * (bw + gapX), y0, bw, bh, DIFFS[k].label, () => setDiff(k), { fill: DIFFS[k].color, active: on }); i++; }
    const w3 = 80, g3 = 8, x3 = (W - (w3 * 3 + g3 * 2)) / 2, y3 = groundY + 32;
    button('sound', x3, y3, w3, 30, Audio.sfxMuted ? 'Lyd av' : 'Lyd på', () => Audio.toggleSfx(), { active: !Audio.sfxMuted, size: 12 });
    button('music', x3 + w3 + g3, y3, w3, 30, Audio.musMuted ? 'Musikk av' : 'Musikk', () => Audio.toggleMusic(), { active: !Audio.musMuted, fill: '#FF9BC0', size: 12 });
    button('theme', x3 + (w3 + g3) * 2, y3, w3, 30, themeName === 'day' ? 'Dag' : 'Natt', toggleTheme, { fill: themeName === 'day' ? '#FFD23F' : '#B9C6FF', size: 12 });
  }

  if (state === State.READY) {
    text('Klar?', W / 2, topY + 40, 32, { color: '#FFD23F' });
    text(D.label, W / 2, topY + 70, 13, { weight: 600, color: D.color });
    const hy = groundY * 0.42 + 30 + Math.sin(time * 6) * 3;
    ctx.fillStyle = 'rgba(255,255,255,.9)'; rr(W / 2 + 36, hy, 20, 30, 10); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(W / 2 + 44, hy + 5, 4, 10, 2); ctx.fill();
    text('Trykk', W / 2, groundY * 0.42 + 78, 14, { weight: 600 });
  }

  if (state === State.PLAY || state === State.DEAD) {
    const pop = 1 + scorePop * 0.35;
    ctx.save(); ctx.translate(W / 2, topY + 16); ctx.scale(pop, pop); text(String(score), 0, 0, 40); ctx.restore();
    drawActiveHud(topY + 46);
  }

  if (state === State.OVER) {
    const e = Math.min(1, overT / 0.5), ease = 1 - Math.pow(1 - e, 3);
    const pw = 236, ph = 132, pxx = (W - pw) / 2, py = groundY * 0.48 - ph / 2 + (1 - ease) * 80;
    text('Spillet er over', W / 2, py - 40 - (1 - ease) * 40, 24, { color: '#FF8A3D' });
    panel(pxx, py, pw, ph);
    const m = medalFor(score);
    if (m) { drawMedal(pxx + 48, py + 62, m); text(m[2], pxx + 48, py + 100, 11, { color: '#5B5540', shadow: false, weight: 600 }); }
    else { ctx.fillStyle = '#E8E4D2'; ctx.beginPath(); ctx.arc(pxx + 48, py + 62, 20, 0, 7); ctx.fill(); text('Ingen medalje', pxx + 48, py + 100, 10, { color: '#8E8760', shadow: false, weight: 600 }); }
    const shown = Math.min(score, Math.floor(Math.max(0, overT - 0.5) * 30));
    text('Poeng', pxx + pw - 26, py + 30, 12, { align: 'right', color: '#8E8760', shadow: false, weight: 600 });
    text(String(shown), pxx + pw - 26, py + 54, 28, { align: 'right', color: '#2B2400', shadow: false });
    text('Beste', pxx + pw - 26, py + 84, 12, { align: 'right', color: '#8E8760', shadow: false, weight: 600 });
    text(String(best), pxx + pw - 26, py + 108, 28, { align: 'right', color: '#2B2400', shadow: false });
    if (newBest && shown === score) { ctx.fillStyle = '#FF6B57'; rr(pxx + pw - 118, py + 74, 34, 18, 9); ctx.fill(); text('Ny!', pxx + pw - 101, py + 83.5, 11, { shadow: false, weight: 600 }); }
    text(D.label, pxx + 48, py + 22, 11, { color: D.color, shadow: false, weight: 600 });
    if (overT > 0.9) text('Trykk for å prøve igjen', W / 2, py + ph + 30, 14, { weight: 600, alpha: 0.6 + 0.4 * Math.sin(time * 5) });
  }

  // vignett
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, T.vignette);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (state === State.PLAY && active.slow > 0) {
    const sg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
    sg.addColorStop(0, 'rgba(176,107,255,0)'); sg.addColorStop(1, 'rgba(176,107,255,.3)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  if (transitionT > 0) { ctx.fillStyle = `rgba(0,0,0,${transitionT * 0.45})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

/* ---------- Størrelse ---------- */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = vw / LOGICAL_W; W = LOGICAL_W; H = Math.round(vh / scale);
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);visibility:hidden';
  document.body.appendChild(probe); safeTop = Math.round(probe.getBoundingClientRect().top / scale); probe.remove();
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
  const groundY = H - GROUND_H;
  stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * (groundY - 200), r: Math.random() < 0.3 ? 1.6 : 1, p: Math.random() * 10 }));
  dust = Array.from({ length: 18 }, () => ({ x: Math.random() * W, y: Math.random() * (groundY - 40), r: 0.8 + Math.random() * 1.2, vx: 4 + Math.random() * 10, f: 0.5 + Math.random(), p: Math.random() * 6 }));
  if (bird && state !== State.PLAY) bird.y = groundY * 0.42;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- Løkke: fast fysikk-steg, render hver frame ---------- */
let lastTime = 0, acc = 0;
function loop(t) {
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / 1000; lastTime = t;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n++ < 12) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}

/* ---------- PWA ---------- */
const installBtn = document.getElementById('install');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBtn.classList.add('show'); });
installBtn.addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.classList.remove('show'); });
window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

document.documentElement.style.setProperty('--sky', T.skyTop);
document.querySelector('meta[name=theme-color]').content = T.skyTop;
resize(); goMenu();
const start = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("700 20px Fredoka"), document.fonts.load("600 14px Fredoka")]).finally(start); else start();
</script>
</body>
